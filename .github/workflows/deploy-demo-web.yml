name: Deploy Demo Web

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container image tag to deploy. Defaults to the current commit SHA."
        required: false
        default: ""
      environment:
        description: "GitHub environment used for Azure OIDC."
        required: true
        default: "mvp"
      auth_mode:
        description: "Customer authentication mode for the deployed demo."
        required: true
        default: "local_signup"
        type: choice
        options:
          - local_signup
          - entra_external
      container_app_name:
        description: "Azure Container App name for the ECloe Market/Pay demo."
        required: true
        default: "ecloe-demo-web"
      containerapp_environment:
        description: "Azure Container Apps environment name."
        required: true
        default: "ecloe-demo-aca-env"
      location:
        description: "Azure region for the Container Apps environment when it must be created."
        required: true
        default: "chilecentral"

permissions:
  contents: read
  id-token: write

jobs:
  deploy-demo-web:
    name: Build, push, and deploy Demo Market/Pay
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.ACR_LOGIN_SERVER || 'ecloedemo1266.azurecr.io' }}/ecloe-demo-web:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build demo image
        run: |
          docker build \
            --file Dockerfile.demo \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg VERSION="${{ steps.image.outputs.tag }}" \
            --tag "${{ steps.image.outputs.image }}" \
            .

      - name: Smoke local demo image
        shell: bash
        run: |
          docker run -d --rm --name ecloe-demo-web-smoke -p 8000:8000 \
            -e APP_ENVIRONMENT=local \
            -e ECLOE_WEB_AUTH_MODE=local \
            -e ECLOE_PAY_DATABASE_MODE=memory \
            -e ECLOE_MARKET_DATABASE_MODE=memory \
            -e ECLOE_MARKET_CATALOG_PATH=data/demo/ecloe_market_catalog.azure.json \
            -e ECLOE_PAY_COOKIE_SECURE=true \
            "${{ steps.image.outputs.image }}"
          trap 'docker stop ecloe-demo-web-smoke' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/market; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/market
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/pay/login

      - name: Push image
        run: |
          az acr login --name "${{ vars.ACR_NAME || 'ecloedemo1266' }}"
          docker push "${{ steps.image.outputs.image }}"

      - name: Ensure Container Apps environment exists
        shell: bash
        run: |
          if ! az containerapp env show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ inputs.containerapp_environment }}" >/dev/null 2>&1; then
            az containerapp env create \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ inputs.containerapp_environment }}" \
              --location "${{ inputs.location }}"
          fi

      - name: Ensure system identity and validate cloud prerequisites
        shell: bash
        run: |
          test -n "${{ vars.ECLOE_KEY_VAULT_ID }}" || { echo "ECLOE_KEY_VAULT_ID is required"; exit 1; }
          test -n "${{ vars.AZURE_KEY_VAULT_NAME }}" || { echo "AZURE_KEY_VAULT_NAME is required"; exit 1; }
          if [ "${{ inputs.auth_mode }}" = "entra_external" ]; then
            test -n "${{ vars.ECLOE_WEB_ENTRA_AUTHORITY }}" || { echo "ECLOE_WEB_ENTRA_AUTHORITY is required"; exit 1; }
            test -n "${{ vars.ECLOE_WEB_ENTRA_CLIENT_ID }}" || { echo "ECLOE_WEB_ENTRA_CLIENT_ID is required"; exit 1; }
            test -n "${{ vars.ECLOE_WEB_ENTRA_CLIENT_SECRET_URI }}" || { echo "ECLOE_WEB_ENTRA_CLIENT_SECRET_URI is required"; exit 1; }
            test -n "${{ vars.ECLOE_DEMO_WEB_BASE_URL }}" || { echo "ECLOE_DEMO_WEB_BASE_URL is required"; exit 1; }
          fi
          az keyvault show --id "${{ vars.ECLOE_KEY_VAULT_ID }}" --output none
          if az containerapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ inputs.container_app_name }}" --output none 2>/dev/null; then
            az containerapp identity assign \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ inputs.container_app_name }}" \
              --system-assigned \
              --output none
          fi

      - name: Deploy Container App
        shell: bash
        run: |
          ENV_VARS=(
            APP_ENVIRONMENT=cloud
            RATE_LIMIT_BACKEND=redis
            RATE_LIMIT_REDIS_URL=secretref:rate-limit-redis-url
            FLASK_SECRET_KEY=secretref:flask-secret-key
            SUBJECT_KEY_SALT=secretref:subject-key-salt
            ECLOE_PAY_DATABASE_MODE=azure_sql
            ECLOE_MARKET_DATABASE_MODE=azure_sql
            "ECLOE_PAY_SQL_SERVER=${{ vars.ECLOE_PAY_SQL_SERVER || 'ecloe-sql-1266.database.windows.net' }}"
            "ECLOE_PAY_SQL_DATABASE=${{ vars.ECLOE_PAY_SQL_DATABASE || 'ecloe_validation' }}"
            ECLOE_PAY_SQL_AUTH_MODE=managed_identity
            ECLOE_PAY_SQL_DRIVER="ODBC Driver 18 for SQL Server"
            "ECLOE_WEB_AUTH_MODE=${{ inputs.auth_mode }}"
            ECLOE_MARKET_CATALOG_PATH=data/demo/ecloe_market_catalog.azure.json
            ECLOE_PAY_COOKIE_SECURE=true
          )

          if [ "${{ inputs.auth_mode }}" = "entra_external" ]; then
            ENV_VARS+=(
              "ECLOE_WEB_ENTRA_AUTHORITY=${{ vars.ECLOE_WEB_ENTRA_AUTHORITY }}"
              "ECLOE_WEB_ENTRA_CLIENT_ID=${{ vars.ECLOE_WEB_ENTRA_CLIENT_ID }}"
              ECLOE_WEB_ENTRA_CLIENT_SECRET=secretref:entra-client-secret
              "ECLOE_WEB_ENTRA_REDIRECT_URI=${{ vars.ECLOE_DEMO_WEB_BASE_URL }}/auth/callback"
              "ECLOE_WEB_ENTRA_POST_LOGOUT_REDIRECT_URI=${{ vars.ECLOE_DEMO_WEB_BASE_URL }}/"
            )
          fi

          if ! az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ inputs.container_app_name }}" >/dev/null 2>&1; then
            az containerapp create \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ inputs.container_app_name }}" \
              --environment "${{ inputs.containerapp_environment }}" \
              --image "${{ steps.image.outputs.image }}" \
              --ingress external \
              --target-port 8000 \
              --min-replicas 1 \
              --max-replicas 1 \
              --cpu 0.5 \
              --memory 1.0Gi \
              --system-assigned \
              --registry-server "${{ vars.ACR_LOGIN_SERVER || 'ecloedemo1266.azurecr.io' }}" \
              --registry-identity system
          fi

          PRINCIPAL_ID="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ inputs.container_app_name }}" \
            --query identity.principalId -o tsv)"
          ACR_ID="$(az acr show --name "${{ vars.ACR_NAME || 'ecloedemo1266' }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query id -o tsv)"
          if [ "$(az role assignment list --assignee-object-id "${PRINCIPAL_ID}" --scope "${ACR_ID}" --role AcrPull --query 'length(@)' -o tsv)" = "0" ]; then
            az role assignment create \
              --assignee-object-id "${PRINCIPAL_ID}" \
              --assignee-principal-type ServicePrincipal \
              --scope "${ACR_ID}" \
              --role AcrPull
          fi
          az containerapp registry set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ inputs.container_app_name }}" \
            --server "${{ vars.ACR_LOGIN_SERVER || 'ecloedemo1266.azurecr.io' }}" \
            --identity system \
            --output none
          if [ "$(az role assignment list \
            --assignee-object-id "${PRINCIPAL_ID}" \
            --scope "${{ vars.ECLOE_KEY_VAULT_ID }}" \
            --role "Key Vault Secrets User" \
            --query 'length(@)' -o tsv)" = "0" ]; then
            az role assignment create \
              --assignee-object-id "${PRINCIPAL_ID}" \
              --assignee-principal-type ServicePrincipal \
              --scope "${{ vars.ECLOE_KEY_VAULT_ID }}" \
              --role "Key Vault Secrets User"
          fi
          SECRETS=(
            "flask-secret-key=keyvaultref:https://${{ vars.AZURE_KEY_VAULT_NAME }}.vault.azure.net/secrets/${{ vars.FLASK_SECRET_NAME || 'ecloe-flask-secret-key' }},identityref:system"
            "subject-key-salt=keyvaultref:https://${{ vars.AZURE_KEY_VAULT_NAME }}.vault.azure.net/secrets/${{ vars.SUBJECT_KEY_SALT_SECRET_NAME || 'ecloe-subject-key-salt' }},identityref:system"
            "rate-limit-redis-url=keyvaultref:https://${{ vars.AZURE_KEY_VAULT_NAME }}.vault.azure.net/secrets/${{ vars.RATE_LIMIT_REDIS_SECRET_NAME || 'ecloe-rate-limit-redis-url' }},identityref:system"
          )
          if [ "${{ inputs.auth_mode }}" = "entra_external" ]; then
            SECRETS+=("entra-client-secret=keyvaultref:${{ vars.ECLOE_WEB_ENTRA_CLIENT_SECRET_URI }},identityref:system")
          fi
          for attempt in {1..12}; do
            if az containerapp secret set \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ inputs.container_app_name }}" \
              --secrets "${SECRETS[@]}" \
              --output none; then
              break
            fi
            if [ "${attempt}" = "12" ]; then
              exit 1
            fi
            sleep 10
          done
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ inputs.container_app_name }}" \
            --image "${{ steps.image.outputs.image }}" \
            --set-env-vars "${ENV_VARS[@]}" \
            --min-replicas 1 \
            --max-replicas 1 \
            --cpu 0.5 \
            --memory 1.0Gi

      - name: Smoke deployed demo
        shell: bash
        run: |
          FQDN="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ inputs.container_app_name }}" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)"
          echo "Demo URL: https://${FQDN}"
          curl --retry 12 --retry-delay 10 --retry-connrefused --fail --silent --show-error --output /dev/null "https://${FQDN}/healthz"
          curl --retry 12 --retry-delay 10 --retry-connrefused --fail --silent --show-error --output /dev/null "https://${FQDN}/market"
          curl --retry 12 --retry-delay 10 --retry-connrefused --fail --silent --show-error --output /dev/null "https://${FQDN}/pay/login"
