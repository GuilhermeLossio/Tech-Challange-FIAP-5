name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  test:
    name: Ruff, tests, coverage, audit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps -e .

      - name: Ruff
        run: ruff check src tests

      - name: Tests and coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=70
        env:
          PYTHONPATH: .
          ECLOE_PAY_SQL_CONTRACT_TESTS: "0"

      - name: Dependency audit
        run: pip-audit --requirement requirements.lock --no-deps --progress-spinner off

      - name: OpenAPI contract check
        run: python scripts/check_openapi_contract.py

      - name: Container build
        run: docker build -t ecloe-engine:ci .

      - name: Start container for load smoke
        run: |
          docker run -d --name ecloe-engine-load -p 8000:8000 \
            -e ARTIFACT_SOURCE=file -e AUTH_MODE=disabled \
            ecloe-engine:ci
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/livez; then
              exit 0
            fi
            if ! docker inspect --format='{{.State.Running}}' ecloe-engine-load 2>/dev/null | grep -q true; then
              echo "Engine container stopped before becoming ready."
              docker logs ecloe-engine-load 2>&1 || true
              exit 1
            fi
            sleep 2
          done
          echo "Engine container did not become ready within 60 seconds."
          docker logs ecloe-engine-load 2>&1 || true
          exit 1

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 SLO smoke
        run: k6 run load/k6-smoke.js

      - name: Stop load container
        if: always()
        run: docker rm --force ecloe-engine-load || true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sql-integration:
    name: Azure SQL integration contracts
    # Temporary opt-in until the ci-sql OIDC identity and secrets are configured.
    if: vars.RUN_AZURE_SQL_INTEGRATION == 'true'
    runs-on: ubuntu-latest
    environment: ci-sql
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps -e .

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply versioned migrations
        env:
          ECLOE_PAY_SQLALCHEMY_URL: ${{ secrets.ECLOE_SQL_TEST_URL }}
        run: alembic upgrade head

      - name: Run SQL contract tests
        env:
          PYTHONPATH: .
          ECLOE_PAY_SQL_CONTRACT_TESTS: "1"
          ECLOE_PAY_DATABASE_MODE: azure_sql
          ECLOE_MARKET_DATABASE_MODE: azure_sql
          ECLOE_PAY_SQL_SERVER: ${{ vars.ECLOE_PAY_SQL_SERVER }}
          ECLOE_PAY_SQL_DATABASE: ${{ vars.ECLOE_PAY_SQL_DATABASE }}
          ECLOE_PAY_SQL_AUTH_MODE: managed_identity
          ECLOE_PAY_SQL_DRIVER: ODBC Driver 18 for SQL Server
        run: python -m pytest tests/test_ecloe_pay_contract.py tests/test_market_repository_contract.py -q
