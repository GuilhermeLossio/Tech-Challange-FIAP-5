name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container image tag to deploy. Defaults to the current commit SHA."
        required: false
        default: ""
      environment:
        description: "GitHub environment used for Azure OIDC."
        required: true
        default: "mvp"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.ACR_LOGIN_SERVER || 'ecloedemo1266.azurecr.io' }}/ecloe-engine:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build local image
        run: docker build --build-arg VCS_REF="${GITHUB_SHA}" --build-arg VERSION="${{ steps.image.outputs.tag }}" -t "${{ steps.image.outputs.image }}" .

      - name: Smoke local image startup
        shell: bash
        run: |
          docker run -d --rm --name ecloe-engine-smoke -p 8000:8000 \
            -e ARTIFACT_SOURCE=file \
            -e AUTH_MODE=disabled \
            -e API_HOST=0.0.0.0 \
            "${{ steps.image.outputs.image }}"
          for i in {1..30}; do
            curl --fail http://127.0.0.1:8000/livez && break
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/livez
          curl --fail http://127.0.0.1:8000/docs
          curl --fail http://127.0.0.1:8000/openapi.json
          docker stop ecloe-engine-smoke

      - name: Push image
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker push "${{ steps.image.outputs.image }}"

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/bicep/main.bicep \
            --parameters \
              environmentName="${{ inputs.environment }}" \
              location="${{ vars.AZURE_LOCATION || 'chilecentral' }}" \
              containerImage="${{ steps.image.outputs.image }}" \
              acrName="${{ vars.ACR_NAME || 'ecloedemo1266' }}" \
              containerAppsEnvironmentName="${{ vars.CONTAINERAPPS_ENVIRONMENT || 'ecloe-demo-aca-env' }}" \
              entraTenantId="${{ secrets.AZURE_TENANT_ID }}" \
              entraClientId="${{ secrets.ENTRA_CLIENT_ID }}" \
              subjectKeySalt="${{ secrets.SUBJECT_KEY_SALT }}" \
              cosmosAccountName="${{ vars.AZURE_COSMOS_ACCOUNT || 'ecloe5cosmos1266cl' }}" \
              cosmosDatabaseName="${{ vars.AZURE_COSMOS_DATABASE || 'ecloe' }}"

      - name: Show deployment URL
        run: |
          az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ecloe-engine-${{ inputs.environment }}" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv
