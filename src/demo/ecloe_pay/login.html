<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ t("login.title") }}</title>
    <link rel="stylesheet" href="../login.css" />
  </head>
  <body class="login-page">
    <main class="login-shell" aria-label="{{ t("login.shellAria") }}">
      <section class="card login-panel" aria-labelledby="loginTitle">
        <div class="login-brand">
          <span class="login-brand-sprite sprite-art sprite-brand-mark" aria-hidden="true"></span>
          <span>ECloe<span>Pay</span></span>
        </div>

        <p class="login-eyebrow">{{ t("login.eyebrow") }}</p>
        <h1 id="loginTitle">{{ t("login.heading") }}</h1>
        <p class="login-badge">{{ t("login.badge") }}</p>
        <p class="login-copy">{{ t("login.copy") }}</p>

        <form id="loginForm" class="login-form">
          <label for="email">{{ t("login.email") }}</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="{{ t("login.emailPlaceholder") }}"
            autocomplete="username"
          />

          <label for="password">{{ t("login.password") }}</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="{{ t("login.passwordPlaceholder") }}"
            autocomplete="current-password"
          />

          <button type="submit">{{ t("login.submit") }}</button>
          <p id="loginStatus" role="status"></p>
        </form>

        <ul class="login-safety-list" aria-label="{{ t("login.safetyAria") }}">
          <li>{{ t("login.noBank") }}</li>
          <li>{{ t("login.noMoney") }}</li>
          <li>{{ t("login.azure") }}</li>
        </ul>

        <a class="login-back-link" href="/?lang={{ locale }}">{{ t("login.back") }}</a>
      </section>
    </main>

    <script type="module">
      const form = document.querySelector("#loginForm");
      const status = document.querySelector("#loginStatus");

      function cookieValue(name) {
        return document.cookie
          .split("; ")
          .find((entry) => entry.startsWith(`${name}=`))
          ?.split("=")[1] || "";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "";
        const payload = {
          email: form.email.value.trim(),
          password: form.password.value,
        };
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRF-Token": decodeURIComponent(cookieValue("ecloe_pay_csrf")),
          },
          body: JSON.stringify(payload),
        });
        const body = await response.json();
        if (!response.ok) {
          status.textContent = body.error || "{{ t("login.loginFailed") }}";
          return;
        }
        window.location.assign(`/pay?lang={{ locale }}`);
      });
    </script>
  </body>
</html>
