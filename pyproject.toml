[project]
name = "ecloe"
version = "0.1.0"
description = "Adaptive experimentation platform for personalized financial offers."
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "fastapi>=0.111.0",
    "flask>=3.1.0",
    "kaggle>=1.6.17",
    "msal>=1.31.0,<2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "PyJWT[crypto]>=2.8.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.7.0",
    "pip-audit>=2.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]
observability = [
    "azure-monitor-opentelemetry-exporter>=1.0.0b30",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-sdk>=1.25.0",
]
azure = [
    "azure-cosmos>=4.7.0",
    "azure-identity>=1.17.0",
    "azure-storage-blob>=12.22.0",
]
azure-sql = [
    "azure-identity>=1.17.0",
    "pyodbc>=5.1.0",
    "sqlalchemy>=2.0.0",
]
space-image = [
    "gradio_client>=1.8.0",
]
zimage-local = [
    "accelerate>=1.0.0",
    "diffusers>=0.35.0",
    "pillow>=10.0.0",
    "transformers>=4.50.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/test_api_main.py" = ["E402"]
