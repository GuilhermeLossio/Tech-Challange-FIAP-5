[project]
name = "ecloe"
version = "0.1.0"
description = "Adaptive experimentation platform for personalized financial offers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle>=1.6.17",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
azure = [
    "azure-cosmos>=4.7.0",
    "azure-storage-blob>=12.22.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
