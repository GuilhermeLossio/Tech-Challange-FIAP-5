<svg viewBox="0 0 1240 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe lightweight MLOps lifecycle</title>
  <desc id="desc">Six-step ECloe lightweight MLOps lifecycle. The pipeline prepares data, evaluates policies, logs MLflow runs, validates the Golden Set, selects a demo policy, and promotes the policy artifact for light deployment. This offline lifecycle does not include Pay, Market, Service Bus, or Outbox flows.</desc>
  <defs>
    <linearGradient id="neutralCard" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
    <filter id="finalShadow" x="-24%" y="-30%" width="148%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2563eb" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#57606a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#2563eb"/>
    </marker>
    <style>
      .titleText { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #1f2328; font-weight: 700; }
      .sectionText { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #57606a; font-size: 13px; font-weight: 700; }
      .bodyText { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #57606a; font-size: 12px; }
      .cardTitle { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 15px; font-weight: 700; }
      .cardSub { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #57606a; font-size: 11.5px; }
      .badgeText { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #ffffff; font-size: 12px; font-weight: 700; }
      .icon { fill: none; stroke: #57606a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .iconBlue { fill: none; stroke: #2563eb; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>

    <g id="icon-web" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="9" width="26" height="19" rx="3"/>
      <path d="M7 15h26M15 33h10M20 28v5"/>
    </g>
    <g id="icon-shield" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 5l12 5v9c0 8-5 13-12 16C13 32 8 27 8 19v-9l12-5z"/>
      <path d="M15 20l4 4 7-8"/>
    </g>
    <g id="icon-api" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 12l-7 8 7 8M27 12l7 8-7 8M23 9l-6 22"/>
    </g>
    <g id="icon-wallet" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 13h24a4 4 0 0 1 4 4v13H9a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4h20v5"/>
      <path d="M27 22h8M29 22h1"/>
    </g>
    <g id="icon-cart" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8h4l4 17h16l4-12H13"/>
      <circle cx="17" cy="32" r="2.4"/>
      <circle cx="29" cy="32" r="2.4"/>
    </g>
    <g id="icon-decision" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 13h8M8 27h8M24 20h8"/>
      <circle cx="20" cy="13" r="4"/>
      <circle cx="20" cy="27" r="4"/>
      <circle cx="20" cy="20" r="4"/>
    </g>
    <g id="icon-database" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="20" cy="10" rx="12" ry="5"/>
      <path d="M8 10v18c0 3 5 5 12 5s12-2 12-5V10"/>
      <path d="M8 19c0 3 5 5 12 5s12-2 12-5"/>
    </g>
    <g id="icon-bus" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="10" width="26" height="20" rx="4"/>
      <path d="M11 16h18M11 22h12"/>
      <path d="M14 34v-4M26 34v-4"/>
    </g>
    <g id="icon-worker" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="5"/>
      <path d="M20 6v5M20 29v5M6 20h5M29 20h5M10 10l4 4M26 26l4 4M30 10l-4 4M14 26l-4 4"/>
    </g>
    <g id="icon-artifact" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 12h10l3 4h13v15H7z"/>
      <path d="M15 25h10M20 20v10"/>
    </g>
    <g id="icon-chart" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 31h24"/>
      <rect x="10" y="20" width="5" height="11" rx="1"/>
      <rect x="18" y="14" width="5" height="17" rx="1"/>
      <rect x="26" y="9" width="5" height="22" rx="1"/>
    </g>
    <g id="icon-doc" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6h12l6 6v22H12z"/>
      <path d="M24 6v8h6M16 20h12M16 26h12"/>
    </g>
    <g id="icon-eye" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 20s6-9 15-9 15 9 15 9-6 9-15 9-15-9-15-9z"/>
      <circle cx="20" cy="20" r="4"/>
    </g>
  </defs>

  <rect width="1240" height="520" fill="#ffffff"/>
  <text x="620" y="48" text-anchor="middle" class="titleText" font-size="24">ECloe - Lightweight MLOps Lifecycle</text>
  <text x="620" y="76" text-anchor="middle" class="bodyText" font-size="13">Local-first pipeline to track, validate, and promote a demonstrable policy artifact with low operational cost.</text>

  <rect x="40" y="112" width="1160" height="288" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="70" y="140" class="sectionText">Evaluation and promotion pipeline</text>

  <line x1="240" y1="254" x2="292" y2="254" stroke="#57606a" stroke-width="2.3" marker-end="url(#arrowGray)"/>
  <line x1="422" y1="254" x2="474" y2="254" stroke="#4f79c9" stroke-width="2.7" marker-end="url(#arrowBlue)" opacity="0.78"/>
  <line x1="604" y1="254" x2="656" y2="254" stroke="#3c6fd3" stroke-width="2.9" marker-end="url(#arrowBlue)" opacity="0.84"/>
  <line x1="786" y1="254" x2="838" y2="254" stroke="#3268d0" stroke-width="3.1" marker-end="url(#arrowBlue)" opacity="0.92"/>
  <line x1="968" y1="254" x2="1020" y2="254" stroke="#2563eb" stroke-width="3.3" marker-end="url(#arrowBlue)"/>

  <g data-card="true" transform="translate(76 168)" filter="url(#softShadow)">
    <rect width="164" height="156" rx="11" fill="url(#neutralCard)" stroke="#d0d7de"/>
    <use href="#icon-chart" transform="translate(122 12) scale(0.58)" color="#57606a" aria-hidden="true"/>
    <circle cx="25" cy="25" r="15" fill="#57606a"/>
    <text x="25" y="29" text-anchor="middle" class="badgeText">1</text>
    <g class="icon" transform="translate(58 18)">
      <ellipse cx="24" cy="10" rx="24" ry="8"/>
      <path d="M 0 10 v32 c0 4.4 10.7 8 24 8 s24 -3.6 24 -8 V10"/>
      <path d="M 0 26 c0 4.4 10.7 8 24 8 s24 -3.6 24 -8"/>
    </g>
    <text x="82" y="82" text-anchor="middle" class="cardTitle">Prepare Data</text>
    <text x="82" y="106" text-anchor="middle" class="cardSub">Kaggle source cleaned</text>
    <text x="82" y="124" text-anchor="middle" class="cardSub">and leakage-checked</text>
    <text x="82" y="142" text-anchor="middle" class="cardSub">for local evaluation.</text>
  </g>

  <g data-card="true" transform="translate(258 168)" filter="url(#softShadow)">
    <rect width="164" height="156" rx="11" fill="url(#neutralCard)" stroke="#c6d6f4"/>
    <use href="#icon-chart" transform="translate(122 12) scale(0.58)" color="#57606a" aria-hidden="true"/>
    <circle cx="25" cy="25" r="15" fill="#4f6f9d"/>
    <text x="25" y="29" text-anchor="middle" class="badgeText">2</text>
    <g class="icon" transform="translate(56 18)">
      <path d="M 26 4 v48"/>
      <path d="M 10 16 h32"/>
      <path d="M 15 16 l-9 20 h18 z"/>
      <path d="M 37 16 l-9 20 h18 z"/>
      <path d="M 12 52 h28"/>
      <path d="M 49 10 l5 5 l10 -11" stroke="#2563eb"/>
    </g>
    <text x="82" y="82" text-anchor="middle" class="cardTitle">
      <tspan x="82" dy="0">Evaluate</tspan>
      <tspan x="82" dy="18">Policies</tspan>
    </text>
    <text x="82" y="122" text-anchor="middle" class="cardSub">Compare baseline and</text>
    <text x="82" y="140" text-anchor="middle" class="cardSub">adaptive candidates.</text>
  </g>

  <g data-card="true" transform="translate(440 168)" filter="url(#softShadow)">
    <rect width="164" height="156" rx="11" fill="url(#neutralCard)" stroke="#bcd2f3"/>
    <use href="#icon-artifact" transform="translate(122 12) scale(0.58)" color="#57606a" aria-hidden="true"/>
    <circle cx="25" cy="25" r="15" fill="#3f71c8"/>
    <text x="25" y="29" text-anchor="middle" class="badgeText">3</text>
    <g class="icon" transform="translate(57 20)">
      <path d="M 7 47 h48"/>
      <rect x="11" y="27" width="9" height="20" rx="2"/>
      <rect x="27" y="15" width="9" height="32" rx="2"/>
      <rect x="43" y="6" width="9" height="41" rx="2"/>
      <path d="M 7 12 c13 0 15 10 25 10 c8 0 11 -7 23 -7" stroke="#2563eb"/>
    </g>
    <text x="82" y="82" text-anchor="middle" class="cardTitle">Log MLflow</text>
    <text x="82" y="106" text-anchor="middle" class="cardSub">Track params, metrics,</text>
    <text x="82" y="124" text-anchor="middle" class="cardSub">artifacts, and run</text>
    <text x="82" y="142" text-anchor="middle" class="cardSub">metadata locally.</text>
  </g>

  <g data-card="true" transform="translate(622 168)" filter="url(#softShadow)">
    <rect width="164" height="156" rx="11" fill="url(#neutralCard)" stroke="#aac7f4"/>
    <use href="#icon-chart" transform="translate(122 12) scale(0.58)" color="#57606a" aria-hidden="true"/>
    <circle cx="25" cy="25" r="15" fill="#326ad7"/>
    <text x="25" y="29" text-anchor="middle" class="badgeText">4</text>
    <g class="iconBlue" transform="translate(56 18)">
      <path d="M 27 4 l6 13 l14 2 l-10 10 l2 14 l-12 -7 l-12 7 l2 -14 l-10 -10 l14 -2 z"/>
      <path d="M 52 11 h10"/>
      <path d="M 52 24 h10"/>
      <path d="M 52 37 h10"/>
    </g>
    <text x="82" y="82" text-anchor="middle" class="cardTitle">Golden Set</text>
    <text x="82" y="106" text-anchor="middle" class="cardSub">Validate five stable</text>
    <text x="82" y="124" text-anchor="middle" class="cardSub">cases with reason</text>
    <text x="82" y="142" text-anchor="middle" class="cardSub">codes for review.</text>
  </g>

  <g data-card="true" transform="translate(804 168)" filter="url(#softShadow)">
    <rect width="164" height="156" rx="11" fill="url(#blueCard)" stroke="#8fb5f1"/>
    <use href="#icon-decision" transform="translate(122 12) scale(0.58)" color="#2563eb" aria-hidden="true"/>
    <circle cx="25" cy="25" r="15" fill="#2563eb"/>
    <text x="25" y="29" text-anchor="middle" class="badgeText">5</text>
    <g class="iconBlue" transform="translate(58 18)">
      <path d="M 10 7 l30 22 l-14 3 l-5 13 z"/>
      <path d="M 34 35 l12 12"/>
      <rect x="43" y="43" width="15" height="10" rx="2"/>
    </g>
    <text x="82" y="82" text-anchor="middle" class="cardTitle">
      <tspan x="82" dy="0">Select Demo</tspan>
      <tspan x="82" dy="18">Policy</tspan>
    </text>
    <text x="82" y="122" text-anchor="middle" class="cardSub">Promote the best</text>
    <text x="82" y="140" text-anchor="middle" class="cardSub">explainable option.</text>
  </g>

  <g data-card="true" transform="translate(986 160)" filter="url(#finalShadow)">
    <rect width="178" height="172" rx="12" fill="url(#blueCard)" stroke="#2563eb" stroke-width="2.4"/>
    <use href="#icon-decision" transform="translate(136 12) scale(0.58)" color="#2563eb" aria-hidden="true"/>
    <circle cx="28" cy="28" r="16" fill="#2563eb"/>
    <text x="28" y="32" text-anchor="middle" class="badgeText">6</text>
    <g class="iconBlue" transform="translate(68 16) scale(0.68)">
      <path d="M 12 40 c-7 0 -12 -5 -12 -11 c0 -5 4 -10 10 -11 c3 -9 11 -15 21 -15 c11 0 20 8 22 19 c6 1 10 6 10 12 c0 8 -6 14 -15 14 H12"/>
      <path d="M 31 48 v19"/>
      <path d="M 23 58 l8 9 l8 -9"/>
    </g>
    <text x="89" y="88" text-anchor="middle" class="cardTitle">Promote Artifact</text>
    <text x="89" y="113" text-anchor="middle" class="cardSub">Publish selected policy</text>
    <text x="89" y="132" text-anchor="middle" class="cardSub">manifest and artifact</text>
    <text x="89" y="151" text-anchor="middle" class="cardSub">for serving.</text>
  </g>

  <polyline points="706,342 706,382 158,382 158,342" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="7 7" marker-end="url(#arrowBlue)" opacity="0.72"/>
  <rect x="438" y="350" width="262" height="28" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="569" y="369" text-anchor="middle" class="bodyText" font-size="12">feedback loop</text>

  <g transform="translate(160 432)">
    <rect width="920" height="48" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="28" cy="24" r="6" fill="#2563eb"/>
    <text x="46" y="21" class="bodyText">MLflow: experiment tracking, metrics, and artifacts.</text>
    <circle cx="486" cy="24" r="6" fill="#57606a"/>
    <text x="504" y="21" class="bodyText">Golden Set: deterministic cases for explainable validation.</text>
    <text x="46" y="38" class="bodyText">Main flow is blue; dashed arrow indicates offline learning.</text>
  </g>
</svg>
