<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe Pay transfer flow</title>
  <desc id="desc">ECloe Pay transfer flow with gateway authentication, Demo BFF orchestration, Pay Transaction API, synchronous Engine Decision API validation, Azure SQL transaction with outbox row, Outbox Publisher, Service Bus publication, and Decision Reward Store.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1280" height="560" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">ECloe Pay Transfer Flow</text>
  <text x="640" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Decision checks are synchronous; durable events are published only after the Pay SQL transaction commits.</text>

  <rect x="40" y="120" width="150" height="96" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="151" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Customer</text>
  <text x="115" y="174" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">accepts wallet</text>
  <text x="115" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">benefit</text>
  <rect x="230" y="120" width="150" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="305" y="151" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Demo Web</text>
  <text x="305" y="174" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">submits action</text>
  <text x="305" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">with CSRF</text>
  <rect x="420" y="120" width="160" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="500" y="151" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Gateway/Auth</text>
  <text x="500" y="174" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">JWT, rate limit,</text>
  <text x="500" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">correlation ID</text>
  <rect x="620" y="120" width="160" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="700" y="151" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Demo BFF</text>
  <text x="700" y="174" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">loads session</text>
  <text x="700" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">and context</text>
  <rect x="820" y="120" width="180" height="96" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="910" y="151" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Pay Transaction API</text>
  <text x="910" y="174" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">wallet ledger and</text>
  <text x="910" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">payment state</text>
  <rect x="1050" y="120" width="180" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1140" y="151" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Engine Decision API</text>
  <text x="1140" y="174" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">checks decision</text>
  <text x="1140" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">and reward rules</text>

  <line x1="190" y1="168" x2="230" y2="168" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <line x1="380" y1="168" x2="420" y2="168" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="168" x2="620" y2="168" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="780" y1="168" x2="820" y2="168" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="150" x2="1050" y2="150" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="1050" y1="188" x2="1000" y2="188" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="125" y="244" width="110" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="180" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#2563eb">tap</text>
  <rect x="385" y="244" width="110" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="440" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">HTTPS</text>
  <rect x="725" y="244" width="150" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="800" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">wallet command</text>
  <rect x="1015" y="244" width="210" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="1120" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">validate decision / reward</text>

  <rect x="130" y="340" width="220" height="86" rx="12" fill="#eff6ff" stroke="#2563eb"/>
  <text x="240" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Pay Transaction Store</text>
  <text x="240" y="390" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Azure SQL transaction</text>
  <text x="240" y="408" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">wallet state + outbox</text>
  <rect x="460" y="340" width="190" height="86" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="555" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Outbox Publisher</text>
  <text x="555" y="390" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">polls committed</text>
  <text x="555" y="408" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">outbox rows</text>
  <rect x="760" y="340" width="170" height="86" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="845" y="372" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Service Bus</text>
  <text x="845" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">domain events</text>
  <rect x="1040" y="340" width="190" height="86" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1135" y="372" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Decision/Reward Store</text>
  <text x="1135" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Cosmos evidence</text>

  <polyline points="910,216 910,292 240,292 240,340" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <line x1="350" y1="383" x2="460" y2="383" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="650" y1="383" x2="760" y2="383" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <polyline points="1140,216 1140,292 1135,292 1135,340" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="445" y="278" width="260" height="28" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="575" y="297" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#2563eb">commit state + outbox row</text>
  <rect x="370" y="438" width="100" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="420" y="456" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">poll/read</text>
  <rect x="650" y="438" width="110" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="705" y="456" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">publish</text>
  <rect x="1030" y="278" width="180" height="28" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="1120" y="297" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">write reward evidence</text>

  <rect x="90" y="490" width="1100" height="44" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="640" y="517" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">There is no direct API-to-publisher call; publication starts from committed SQL outbox rows.</text>
</svg>
