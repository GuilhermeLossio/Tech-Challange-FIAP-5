<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe Pay transfer flow</title>
  <desc id="desc">ECloe Pay transfer flow with gateway authentication, Demo BFF orchestration, Pay Transaction API, synchronous Engine Decision API validation, Azure SQL transaction with outbox row, Outbox Publisher, Service Bus publication, and Decision Reward Store.</desc>
  <defs>
    <linearGradient id="ecloeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffde8"/>
      <stop offset="58%" stop-color="#f7ffb9"/>
      <stop offset="100%" stop-color="#dcfff0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087f83"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0bb9b0"/>
    </marker>

    <g id="icon-web" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="9" width="26" height="19" rx="3"/>
      <path d="M7 15h26M15 33h10M20 28v5"/>
    </g>
    <g id="icon-shield" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 5l12 5v9c0 8-5 13-12 16C13 32 8 27 8 19v-9l12-5z"/>
      <path d="M15 20l4 4 7-8"/>
    </g>
    <g id="icon-api" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 12l-7 8 7 8M27 12l7 8-7 8M23 9l-6 22"/>
    </g>
    <g id="icon-wallet" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 13h24a4 4 0 0 1 4 4v13H9a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4h20v5"/>
      <path d="M27 22h8M29 22h1"/>
    </g>
    <g id="icon-cart" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8h4l4 17h16l4-12H13"/>
      <circle cx="17" cy="32" r="2.4"/>
      <circle cx="29" cy="32" r="2.4"/>
    </g>
    <g id="icon-decision" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 13h8M8 27h8M24 20h8"/>
      <circle cx="20" cy="13" r="4"/>
      <circle cx="20" cy="27" r="4"/>
      <circle cx="20" cy="20" r="4"/>
    </g>
    <g id="icon-database" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="20" cy="10" rx="12" ry="5"/>
      <path d="M8 10v18c0 3 5 5 12 5s12-2 12-5V10"/>
      <path d="M8 19c0 3 5 5 12 5s12-2 12-5"/>
    </g>
    <g id="icon-bus" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="10" width="26" height="20" rx="4"/>
      <path d="M11 16h18M11 22h12"/>
      <path d="M14 34v-4M26 34v-4"/>
    </g>
    <g id="icon-worker" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="5"/>
      <path d="M20 6v5M20 29v5M6 20h5M29 20h5M10 10l4 4M26 26l4 4M30 10l-4 4M14 26l-4 4"/>
    </g>
    <g id="icon-artifact" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 12h10l3 4h13v15H7z"/>
      <path d="M15 25h10M20 20v10"/>
    </g>
    <g id="icon-chart" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 31h24"/>
      <rect x="10" y="20" width="5" height="11" rx="1"/>
      <rect x="18" y="14" width="5" height="17" rx="1"/>
      <rect x="26" y="9" width="5" height="22" rx="1"/>
    </g>
    <g id="icon-doc" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6h12l6 6v22H12z"/>
      <path d="M24 6v8h6M16 20h12M16 26h12"/>
    </g>
    <g id="icon-eye" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 20s6-9 15-9 15 9 15 9-6 9-15 9-15-9-15-9z"/>
      <circle cx="20" cy="20" r="4"/>
    </g>
  </defs>
  <rect width="1280" height="560" fill="url(#ecloeBg)"/>
  <text x="640" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14343b">ECloe Pay Transfer Flow</text>
  <text x="640" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#087f83">Decision checks are synchronous; durable events are published only after the Pay SQL transaction commits.</text>

  <rect x="40" y="120" width="150" height="96" rx="12" fill="#d9fff0" stroke="#0bb9b0" stroke-width="1.5" data-card="true"/>
  <use href="#icon-web" transform="translate(48 130) scale(0.30)" color="#0bb9b0" aria-hidden="true"/>
  <text x="88" y="152" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Customer</text>
  <text x="115" y="175" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">accepts wallet</text>
  <text x="115" y="193" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">benefit</text>
  <rect x="230" y="120" width="150" height="96" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-web" transform="translate(238 130) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="278" y="152" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Web</text>
  <text x="305" y="175" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">submits action</text>
  <text x="305" y="193" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">with CSRF</text>
  <rect x="420" y="120" width="160" height="96" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-shield" transform="translate(428 130) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="468" y="152" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Gateway</text>
  <text x="500" y="175" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">JWT, rate limit,</text>
  <text x="500" y="193" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">correlation ID</text>
  <rect x="620" y="120" width="160" height="96" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-api" transform="translate(628 130) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="668" y="152" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Demo BFF</text>
  <text x="700" y="175" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">loads session</text>
  <text x="700" y="193" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">and context</text>
  <rect x="820" y="120" width="180" height="96" rx="12" fill="#d9fff0" stroke="#0bb9b0" stroke-width="1.5" data-card="true"/>
  <use href="#icon-api" transform="translate(904 120) scale(0.30)" color="#0bb9b0" aria-hidden="true"/>
  <text x="910" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14343b">Pay Transaction API</text>
  <text x="910" y="175" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">wallet ledger and</text>
  <text x="910" y="193" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">payment state</text>
  <rect x="1050" y="120" width="180" height="96" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-api" transform="translate(1134 120) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="1140" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14343b">Engine Decision API</text>
  <text x="1140" y="175" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">checks decision</text>
  <text x="1140" y="193" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">and reward rules</text>

  <line x1="190" y1="168" x2="230" y2="168" stroke="#0bb9b0" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <line x1="380" y1="168" x2="420" y2="168" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="168" x2="620" y2="168" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="780" y1="168" x2="820" y2="168" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="150" x2="1050" y2="150" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="1050" y1="188" x2="1000" y2="188" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="125" y="244" width="110" height="26" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="180" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0bb9b0">tap</text>
  <rect x="385" y="244" width="110" height="26" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="440" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">HTTPS</text>
  <rect x="725" y="244" width="150" height="26" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="800" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">wallet command</text>
  <rect x="1015" y="244" width="210" height="26" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="1120" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">validate decision / reward</text>

  <rect x="130" y="340" width="220" height="86" rx="12" fill="#e5fff7" stroke="#0bb9b0" data-card="true"/>
  <use href="#icon-wallet" transform="translate(138 350) scale(0.30)" color="#0bb9b0" aria-hidden="true"/>
  <text x="174" y="372" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14343b">Pay SQL + Outbox</text>
  <text x="240" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">Azure SQL transaction</text>
  <text x="240" y="412" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">wallet state + outbox</text>
  <rect x="460" y="340" width="190" height="86" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-bus" transform="translate(468 350) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="504" y="372" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14343b">Outbox Publisher</text>
  <text x="555" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">polls committed</text>
  <text x="555" y="412" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">outbox rows</text>
  <rect x="760" y="340" width="170" height="86" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-decision" transform="translate(768 350) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="804" y="372" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14343b">Service Bus</text>
  <text x="845" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">domain events</text>
  <rect x="1040" y="340" width="190" height="86" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-decision" transform="translate(1129 342) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="1135" y="372" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14343b">Decision/Reward Store</text>
  <text x="1135" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">Cosmos evidence</text>

  <polyline points="910,216 910,292 240,292 240,340" fill="none" stroke="#0bb9b0" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <line x1="350" y1="383" x2="460" y2="383" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="650" y1="383" x2="760" y2="383" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <polyline points="1140,216 1140,292 1135,292 1135,340" fill="none" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="445" y="278" width="260" height="28" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="575" y="297" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0bb9b0">commit state + outbox row</text>
  <rect x="370" y="438" width="100" height="26" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="420" y="456" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">poll/read</text>
  <rect x="650" y="438" width="110" height="26" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="705" y="456" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">publish</text>
  <rect x="1030" y="278" width="180" height="28" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="1120" y="297" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">write reward evidence</text>

  <rect x="90" y="490" width="1100" height="44" rx="10" fill="#fffbd9" stroke="#8bd9cf"/>
  <text x="640" y="517" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#087f83">There is no direct API-to-publisher call; publication starts from committed SQL outbox rows.</text>
</svg>
