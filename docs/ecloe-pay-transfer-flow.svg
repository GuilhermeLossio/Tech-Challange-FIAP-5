<svg viewBox="0 0 1180 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe Pay transfer flow</title>
  <desc id="desc">Transfer-style flow for the planned ECloe Pay benefit interaction, from user action through BFF, Pay API, PostgreSQL transaction, outbox worker, Service Bus, and Engine reward registration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1180" height="430" fill="#ffffff"/>
  <text x="590" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">ECloe Pay Transfer Flow</text>
  <text x="590" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Planned benefit acceptance flow with transactional persistence and async event publication</text>

  <rect x="40" y="105" width="150" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="68" cy="133" r="14" fill="#2563eb"/>
  <text x="68" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="115" y="135" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Customer</text>
  <text x="115" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Accepts selected</text>
  <text x="115" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">wallet benefit</text>

  <rect x="235" y="105" width="150" height="110" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="263" cy="133" r="14" fill="#57606a"/>
  <text x="263" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="310" y="135" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Demo Web</text>
  <text x="310" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Sends action to</text>
  <text x="310" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">ECloe BFF</text>

  <rect x="430" y="105" width="150" height="110" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="458" cy="133" r="14" fill="#57606a"/>
  <text x="458" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="505" y="135" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">ECloe Pay API</text>
  <text x="505" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Validates session</text>
  <text x="505" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">and decision ID</text>

  <rect x="625" y="105" width="150" height="110" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="653" cy="133" r="14" fill="#57606a"/>
  <text x="653" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="700" y="135" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">PostgreSQL</text>
  <text x="700" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Stores transfer</text>
  <text x="700" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">and outbox row</text>

  <rect x="820" y="105" width="150" height="110" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="848" cy="133" r="14" fill="#57606a"/>
  <text x="848" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="895" y="135" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Outbox Worker</text>
  <text x="895" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Publishes event</text>
  <text x="895" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">asynchronously</text>

  <rect x="1015" y="105" width="125" height="110" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="1043" cy="133" r="14" fill="#57606a"/>
  <text x="1043" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">6</text>
  <text x="1078" y="135" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Service Bus</text>
  <text x="1078" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Distributes</text>
  <text x="1078" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">event</text>

  <line x1="190" y1="160" x2="235" y2="160" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <line x1="385" y1="160" x2="430" y2="160" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="160" x2="625" y2="160" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="775" y1="160" x2="820" y2="160" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="970" y1="160" x2="1015" y2="160" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="235" y="280" width="250" height="72" rx="12" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="307" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">ECloe Engine API</text>
  <text x="360" y="327" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Records reward for the</text>
  <text x="360" y="345" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">original decision ID</text>

  <rect x="555" y="280" width="250" height="72" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="680" y="307" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Cosmos DB</text>
  <text x="680" y="327" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Stores decision and</text>
  <text x="680" y="345" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">reward evidence</text>

  <rect x="875" y="280" width="250" height="72" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1000" y="307" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Technical Timeline</text>
  <text x="1000" y="327" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Feeds demo summary and</text>
  <text x="1000" y="345" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Control Room evidence</text>

  <path d="M 1078 215 C 1078 245, 485 245, 485 300" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="485" y1="316" x2="555" y2="316" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="805" y1="316" x2="875" y2="316" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="40" y="372" width="1100" height="34" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="590" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">The transfer flow is a planned demo wallet interaction. It is not real payment processing, credit approval, or immediate online learning.</text>
</svg>
