<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">ECloe Market Class Diagram</title>
  <desc id="desc">Domain classes for the public marketplace, cart, checkout, orders, payment references, and outbox boundaries.</desc>
  <defs>
    <style>
      .bg{fill:#f7fcf7}.title{font:700 24px Segoe UI,Arial,sans-serif;fill:#064437}.body{font:400 13px Segoe UI,Arial,sans-serif;fill:#31564f}.card{fill:#fff;stroke:#b9d8cf;stroke-width:1.5}.cardTitle{font:700 14px Segoe UI,Arial,sans-serif;fill:#064437}.cardSub{font:400 12px Segoe UI,Arial,sans-serif;fill:#31564f}.section{font:700 15px Segoe UI,Arial,sans-serif;fill:#073f36}.line{stroke:#7da99d;stroke-width:2;fill:none}.icon{stroke:#073f36;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <symbol id="icon-web" viewBox="0 0 40 40"><rect class="icon" x="7" y="10" width="26" height="20" rx="3"/><path class="icon" d="M7 16h26"/></symbol>
    <symbol id="icon-cart" viewBox="0 0 40 40"><path class="icon" d="M9 11h4l3 14h14l3-10H16"/><circle class="icon" cx="18" cy="31" r="2"/><circle class="icon" cx="29" cy="31" r="2"/></symbol>
    <symbol id="icon-database" viewBox="0 0 40 40"><ellipse class="icon" cx="20" cy="11" rx="11" ry="5"/><path class="icon" d="M9 11v18c0 3 5 5 11 5s11-2 11-5V11"/><path class="icon" d="M9 20c0 3 5 5 11 5s11-2 11-5"/></symbol>
    <symbol id="icon-wallet" viewBox="0 0 40 40"><rect class="icon" x="8" y="12" width="25" height="17" rx="3"/><path class="icon" d="M26 18h8v7h-8z"/><path class="icon" d="M12 12l16-5"/></symbol>
    <symbol id="icon-message" viewBox="0 0 40 40"><rect class="icon" x="8" y="10" width="24" height="18" rx="3"/><path class="icon" d="M14 28l-4 5v-5"/><path class="icon" d="M14 17h12M14 22h8"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 40 40"><path class="icon" d="M20 6l12 5v8c0 8-5 13-12 16C13 32 8 27 8 19v-8z"/><path class="icon" d="M14 20l4 4 8-9"/></symbol>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <text x="640" y="46" text-anchor="middle" class="title">ECloe Market - Class Diagram Contract</text>
  <text x="640" y="72" text-anchor="middle" class="body">Classes map to domain dataclasses, repository contracts, Azure SQL tables, and demo-safe UI behavior.</text>

  <text x="70" y="122" class="section">Catalog aggregate</text>
  <rect x="70" y="145" width="210" height="96" rx="8" class="card" data-card="true"/>
  <use href="#icon-database" transform="translate(88 166) scale(0.82)"/>
  <text x="150" y="176" text-anchor="start" class="cardTitle">Category</text>
  <text x="150" y="199" class="cardSub">category_id, slug</text>
  <text x="150" y="217" class="cardSub">localized title, demo flag</text>
  <rect x="320" y="145" width="210" height="116" rx="8" class="card" data-card="true"/>
  <use href="#icon-web" transform="translate(338 166) scale(0.82)"/>
  <text x="400" y="176" text-anchor="start" class="cardTitle">Product</text>
  <text x="400" y="199" class="cardSub">description, brand, sku</text>
  <text x="400" y="217" class="cardSub">thumbnail, status</text>
  <text x="400" y="235" class="cardSub">synthetic display data</text>
  <rect x="570" y="145" width="210" height="116" rx="8" class="card" data-card="true"/>
  <use href="#icon-cart" transform="translate(588 166) scale(0.82)"/>
  <text x="650" y="176" text-anchor="start" class="cardTitle">ProductVariant</text>
  <text x="650" y="199" class="cardSub">variant_id, product_id</text>
  <text x="650" y="217" class="cardSub">sku, default flag</text>
  <text x="650" y="235" class="cardSub">purchasable unit</text>
  <rect x="820" y="145" width="180" height="96" rx="8" class="card" data-card="true"/>
  <use href="#icon-wallet" transform="translate(838 166) scale(0.82)"/>
  <text x="900" y="176" text-anchor="start" class="cardTitle">ProductPrice</text>
  <text x="900" y="199" class="cardSub">price_cents, BRL</text>
  <text x="900" y="217" class="cardSub">current flag</text>
  <rect x="1040" y="145" width="180" height="96" rx="8" class="card" data-card="true"/>
  <use href="#icon-database" transform="translate(1058 166) scale(0.82)"/>
  <text x="1120" y="176" text-anchor="start" class="cardTitle">InventoryItem</text>
  <text x="1120" y="199" class="cardSub">available quantity</text>
  <text x="1120" y="217" class="cardSub">reserved quantity</text>

  <path class="line" d="M280 193H320M530 203H570M780 203H820M1000 193h40"/>

  <text x="70" y="326" class="section">Cart and checkout aggregates</text>
  <rect x="70" y="350" width="210" height="116" rx="8" class="card" data-card="true"/>
  <use href="#icon-cart" transform="translate(88 371) scale(0.82)"/>
  <text x="150" y="381" text-anchor="start" class="cardTitle">Cart</text>
  <text x="150" y="404" class="cardSub">session key, status</text>
  <text x="150" y="422" class="cardSub">total items and cents</text>
  <text x="150" y="440" class="cardSub">public until checkout</text>
  <rect x="320" y="350" width="210" height="116" rx="8" class="card" data-card="true"/>
  <use href="#icon-cart" transform="translate(338 371) scale(0.82)"/>
  <text x="400" y="381" text-anchor="start" class="cardTitle">CartItem</text>
  <text x="400" y="404" class="cardSub">product and variant</text>
  <text x="400" y="422" class="cardSub">quantity, unit price</text>
  <text x="400" y="440" class="cardSub">subtotal cents</text>
  <rect x="570" y="350" width="250" height="116" rx="8" class="card" data-card="true"/>
  <use href="#icon-shield" transform="translate(588 371) scale(0.82)"/>
  <text x="650" y="381" text-anchor="start" class="cardTitle">CheckoutSession</text>
  <text x="650" y="404" class="cardSub">authenticated user</text>
  <text x="650" y="422" class="cardSub">idempotency and correlation</text>
  <text x="650" y="440" class="cardSub">minimized context snapshot</text>
  <path class="line" d="M280 408H320M530 408H570"/>

  <text x="70" y="536" class="section">Order and integration aggregates</text>
  <rect x="70" y="560" width="210" height="116" rx="8" class="card" data-card="true"/>
  <use href="#icon-database" transform="translate(88 581) scale(0.82)"/>
  <text x="150" y="591" text-anchor="start" class="cardTitle">Order</text>
  <text x="150" y="614" class="cardSub">status, total cents</text>
  <text x="150" y="632" class="cardSub">checkout link</text>
  <text x="150" y="650" class="cardSub">no Pay table writes</text>
  <rect x="320" y="560" width="210" height="116" rx="8" class="card" data-card="true"/>
  <use href="#icon-cart" transform="translate(338 581) scale(0.82)"/>
  <text x="400" y="591" text-anchor="start" class="cardTitle">OrderItem</text>
  <text x="400" y="614" class="cardSub">historical title</text>
  <text x="400" y="632" class="cardSub">quantity and price copy</text>
  <rect x="570" y="560" width="230" height="116" rx="8" class="card" data-card="true"/>
  <use href="#icon-wallet" transform="translate(588 581) scale(0.82)"/>
  <text x="650" y="591" text-anchor="start" class="cardTitle">PaymentReference</text>
  <text x="650" y="614" class="cardSub">Pay order reference</text>
  <text x="650" y="632" class="cardSub">amount cents, status</text>
  <rect x="840" y="560" width="210" height="116" rx="8" class="card" data-card="true"/>
  <use href="#icon-message" transform="translate(858 581) scale(0.82)"/>
  <text x="920" y="591" text-anchor="start" class="cardTitle">MarketplaceEvent</text>
  <text x="920" y="614" class="cardSub">event type and payload</text>
  <text x="920" y="632" class="cardSub">demo-safe facts only</text>
  <rect x="1080" y="560" width="160" height="116" rx="8" class="card" data-card="true"/>
  <use href="#icon-message" transform="translate(1098 581) scale(0.82)"/>
  <text x="1160" y="591" text-anchor="start" class="cardTitle">OutboxEvent</text>
  <text x="1160" y="614" class="cardSub">pending publish</text>
  <text x="1160" y="632" class="cardSub">payload JSON</text>
  <path class="line" d="M280 618H320M530 618H570M800 618H840M1050 618h30"/>
</svg>
