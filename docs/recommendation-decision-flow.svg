<svg viewBox="0 0 1240 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe recommendation decision flow</title>
  <desc id="desc">A seven-step orthogonal flow from domain eligibility through strict context validation, policy ranking, presentation, SQL outbox recording, and Cosmos feedback.</desc>
  <defs>
    <linearGradient id="ecloeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffde8"/>
      <stop offset="58%" stop-color="#f7ffb9"/>
      <stop offset="100%" stop-color="#dcfff0"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#247477"/></marker>
    <style>.t{font:700 25px Segoe UI,Arial;fill:#14343b}.s{font:13px Segoe UI,Arial;fill:#3b6b70}.h{font:700 14px Segoe UI,Arial;fill:#14343b}.b{font:12px Segoe UI,Arial;fill:#3b6b70}.n{font:700 12px Segoe UI,Arial;fill:#fff}.l{fill:none;stroke:#247477;stroke-width:2.5;marker-end:url(#a)}</style>
    <g id="icon-web" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="7" width="30" height="23" rx="3"/><path d="M5 14h30M15 35h10M20 30v5"/></g>
    <g id="icon-filter" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 8h30L24 21v11l-8 4V21z"/></g>
    <g id="icon-shield" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 5l12 5v9c0 8-5 13-12 16C13 32 8 27 8 19v-9z"/><path d="M14 20l4 4 8-9"/></g>
    <g id="icon-rank" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M8 11h22M8 20h16M8 29h10"/><circle cx="33" cy="11" r="3"/></g>
    <g id="icon-eye" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 20s6-9 16-9 16 9 16 9-6 9-16 9S4 20 4 20z"/><circle cx="20" cy="20" r="4"/></g>
    <g id="icon-data" fill="none" stroke="currentColor" stroke-width="2.4"><ellipse cx="20" cy="9" rx="12" ry="5"/><path d="M8 9v20c0 3 5 5 12 5s12-2 12-5V9M8 19c0 3 5 5 12 5s12-2 12-5"/></g>
  </defs>
  <rect width="1240" height="690" fill="url(#ecloeBg)"/><text x="620" y="45" text-anchor="middle" class="t">Recommendation Decision Flow</text><text x="620" y="72" text-anchor="middle" class="s">Every selected item must remain inside the owning domain's eligible candidate set.</text>
  <g data-card="true" transform="translate(1045 22)">
    <rect width="150" height="48" rx="8" fill="#fffbd9" stroke="#8bd9cf"/>
    <use href="#icon-web" transform="translate(12 7) scale(.55)" color="#247477"/>
    <text x="55" y="29" class="b">Online flow</text>
  </g>
  <g transform="translate(55 125)"><rect width="230" height="120" rx="8" fill="#e7ffd4" stroke="#0b9f8f" stroke-width="2.5"/><use href="#icon-filter" transform="translate(179 12) scale(.62)" color="#0b9f8f"/><circle cx="25" cy="25" r="15" fill="#0b9f8f"/><text x="25" y="29" text-anchor="middle" class="n">1</text><text x="22" y="62" class="h">Domain filter</text><text x="22" y="88" class="b">Stock and price, or</text><text x="22" y="106" class="b">upstream benefit eligibility</text></g>
  <g transform="translate(360 125)"><rect width="230" height="120" rx="8" fill="#e5fff7" stroke="#0bb9b0" stroke-width="2.5"/><use href="#icon-web" transform="translate(179 12) scale(.62)" color="#0bb9b0"/><circle cx="25" cy="25" r="15" fill="#0bb9b0"/><text x="25" y="29" text-anchor="middle" class="n">2</text><text x="22" y="62" class="h">Context Builder</text><text x="22" y="88" class="b">Aggregate bands and</text><text x="22" y="106" class="b">neutral categories only</text></g>
  <g transform="translate(665 125)"><rect width="230" height="120" rx="8" fill="#fff0d1" stroke="#f08d78" stroke-width="2.5"/><use href="#icon-shield" transform="translate(179 12) scale(.62)" color="#f08d78"/><circle cx="25" cy="25" r="15" fill="#f08d78"/><text x="25" y="29" text-anchor="middle" class="n">3</text><text x="22" y="62" class="h">Strict validation</text><text x="22" y="88" class="b">Type, allowlist, duplicate,</text><text x="22" y="106" class="b">availability, and privacy</text></g>
  <g transform="translate(970 125)"><rect width="215" height="120" rx="8" fill="#e9e8ff" stroke="#6976c7" stroke-width="2.5"/><use href="#icon-rank" transform="translate(164 12) scale(.62)" color="#6976c7"/><circle cx="25" cy="25" r="15" fill="#6976c7"/><text x="25" y="29" text-anchor="middle" class="n">4</text><text x="22" y="62" class="h">Policy ranking</text><text x="22" y="88" class="b">Active result plus</text><text x="22" y="106" class="b">shadow top candidates</text></g>
  <g transform="translate(815 365)"><rect width="230" height="120" rx="8" fill="#e5fff7" stroke="#0bb9b0" stroke-width="2.5"/><use href="#icon-eye" transform="translate(179 12) scale(.62)" color="#0bb9b0"/><circle cx="25" cy="25" r="15" fill="#0bb9b0"/><text x="25" y="29" text-anchor="middle" class="n">5</text><text x="22" y="62" class="h">Present decision</text><text x="22" y="88" class="b">Six Market products or</text><text x="22" y="106" class="b">one Pay benefit</text></g>
  <g transform="translate(510 365)"><rect width="230" height="120" rx="8" fill="#e7ffd4" stroke="#0b9f8f" stroke-width="2.5"/><use href="#icon-data" transform="translate(179 12) scale(.62)" color="#0b9f8f"/><circle cx="25" cy="25" r="15" fill="#0b9f8f"/><text x="25" y="29" text-anchor="middle" class="n">6</text><text x="22" y="62" class="h">Domain interaction</text><text x="22" y="88" class="b">Azure SQL state and</text><text x="22" y="106" class="b">outbox commit together</text></g>
  <g transform="translate(205 365)"><rect width="230" height="120" rx="8" fill="#fff0d1" stroke="#f08d78" stroke-width="2.5"/><use href="#icon-data" transform="translate(179 12) scale(.62)" color="#f08d78"/><circle cx="25" cy="25" r="15" fill="#f08d78"/><text x="25" y="29" text-anchor="middle" class="n">7</text><text x="22" y="62" class="h">Decision and feedback</text><text x="22" y="88" class="b">Cosmos audit history and</text><text x="22" y="106" class="b">verified terminal outcome</text></g>
  <path d="M285 185H360" class="l"/><path d="M590 185H665" class="l"/><path d="M895 185H970" class="l"/><path d="M1078 245V320H930V365" class="l"/><path d="M815 425H740" class="l"/><path d="M510 425H435" class="l"/>
  <rect x="205" y="555" width="840" height="82" rx="10" fill="#ffe4d8" stroke="#dd6b76"/><text x="230" y="585" class="h">No immediate learning</text><text x="230" y="611" class="s">Feedback is appended now. A reviewed batch artifact is the only path back to the active policy.</text>
</svg>
