<svg viewBox="0 0 1180 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe planned demo interface architecture</title>
  <desc id="desc">Planned ECloe Demo interface showing Demo Web screens, API Gateway and Auth boundary, Demo BFF orchestration, Market Transaction API, Pay Transaction API, Engine Decision API, and Decision and Reward Store. The BFF is a demo orchestrator, not the only possible channel integration pattern.</desc>
  <defs>
    <linearGradient id="ecloeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffde8"/>
      <stop offset="58%" stop-color="#f7ffb9"/>
      <stop offset="100%" stop-color="#dcfff0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087f83"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0bb9b0"/>
    </marker>

    <g id="icon-web" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="9" width="26" height="19" rx="3"/>
      <path d="M7 15h26M15 33h10M20 28v5"/>
    </g>
    <g id="icon-shield" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 5l12 5v9c0 8-5 13-12 16C13 32 8 27 8 19v-9l12-5z"/>
      <path d="M15 20l4 4 7-8"/>
    </g>
    <g id="icon-api" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 12l-7 8 7 8M27 12l7 8-7 8M23 9l-6 22"/>
    </g>
    <g id="icon-wallet" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 13h24a4 4 0 0 1 4 4v13H9a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4h20v5"/>
      <path d="M27 22h8M29 22h1"/>
    </g>
    <g id="icon-cart" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8h4l4 17h16l4-12H13"/>
      <circle cx="17" cy="32" r="2.4"/>
      <circle cx="29" cy="32" r="2.4"/>
    </g>
    <g id="icon-decision" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 13h8M8 27h8M24 20h8"/>
      <circle cx="20" cy="13" r="4"/>
      <circle cx="20" cy="27" r="4"/>
      <circle cx="20" cy="20" r="4"/>
    </g>
    <g id="icon-database" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="20" cy="10" rx="12" ry="5"/>
      <path d="M8 10v18c0 3 5 5 12 5s12-2 12-5V10"/>
      <path d="M8 19c0 3 5 5 12 5s12-2 12-5"/>
    </g>
    <g id="icon-bus" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="10" width="26" height="20" rx="4"/>
      <path d="M11 16h18M11 22h12"/>
      <path d="M14 34v-4M26 34v-4"/>
    </g>
    <g id="icon-worker" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="5"/>
      <path d="M20 6v5M20 29v5M6 20h5M29 20h5M10 10l4 4M26 26l4 4M30 10l-4 4M14 26l-4 4"/>
    </g>
    <g id="icon-artifact" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 12h10l3 4h13v15H7z"/>
      <path d="M15 25h10M20 20v10"/>
    </g>
    <g id="icon-chart" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 31h24"/>
      <rect x="10" y="20" width="5" height="11" rx="1"/>
      <rect x="18" y="14" width="5" height="17" rx="1"/>
      <rect x="26" y="9" width="5" height="22" rx="1"/>
    </g>
    <g id="icon-doc" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6h12l6 6v22H12z"/>
      <path d="M24 6v8h6M16 20h12M16 26h12"/>
    </g>
    <g id="icon-eye" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 20s6-9 15-9 15 9 15 9-6 9-15 9-15-9-15-9z"/>
      <circle cx="20" cy="20" r="4"/>
    </g>
  </defs>
  <rect width="1180" height="520" fill="url(#ecloeBg)"/>
  <text x="590" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14343b">ECloe Demo Interface Layer</text>
  <text x="590" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#087f83">Demo BFF orchestrates the web journey; APIs remain domain services behind gateway and auth controls</text>

  <rect x="45" y="112" width="230" height="300" rx="18" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="70" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#087f83">Demo screens</text>
  <rect x="80" y="178" width="160" height="52" rx="10" fill="#d9fff0" stroke="#0bb9b0" stroke-width="1.5" data-card="true"/>
  <use href="#icon-wallet" transform="translate(88 188) scale(0.30)" color="#0bb9b0" aria-hidden="true"/>
  <text x="128" y="210" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Market</text>
  <rect x="80" y="260" width="160" height="52" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-wallet" transform="translate(88 270) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="128" y="292" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Pay</text>
  <rect x="80" y="342" width="160" height="52" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-api" transform="translate(88 352) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="128" y="374" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Control</text>

  <rect x="340" y="112" width="230" height="300" rx="18" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="365" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#087f83">Perimeter and BFF</text>
  <rect x="375" y="190" width="160" height="74" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-shield" transform="translate(383 200) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="419" y="218" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#14343b">API Gateway</text>
  <text x="455" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">auth, rate limit,</text>
  <text x="455" y="256" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">correlation IDs</text>
  <rect x="375" y="315" width="160" height="64" rx="10" fill="#e5fff7" stroke="#0bb9b0" data-card="true"/>
  <use href="#icon-web" transform="translate(383 325) scale(0.30)" color="#0bb9b0" aria-hidden="true"/>
  <text x="423" y="347" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Demo BFF</text>
  <text x="455" y="367" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">web journey only</text>

  <rect x="645" y="112" width="250" height="300" rx="18" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="670" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#087f83">Domain APIs</text>
  <rect x="690" y="170" width="160" height="58" rx="10" fill="#d9fff0" stroke="#0bb9b0" stroke-width="1.5" data-card="true"/>
  <use href="#icon-api" transform="translate(698 180) scale(0.30)" color="#0bb9b0" aria-hidden="true"/>
  <text x="734" y="194" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#14343b">Market Transaction</text>
  <text x="770" y="213" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#087f83">cart and checkout</text>
  <rect x="690" y="262" width="160" height="58" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-api" transform="translate(698 272) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="734" y="286" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14343b">Pay Transaction</text>
  <text x="770" y="305" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#087f83">wallet state</text>
  <rect x="690" y="350" width="160" height="42" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-api" transform="translate(698 360) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="734" y="378" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14343b">Engine Decision</text>

  <rect x="965" y="180" width="170" height="80" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-api" transform="translate(973 190) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="1009" y="212" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14343b">Evidence Store</text>
  <text x="1050" y="234" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">implemented persistence</text>

  <polyline points="240,204 307,204 307,227 375,227" fill="none" stroke="#0bb9b0" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="309" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0bb9b0">secure route</text>
  <polyline points="240,286 307,286 307,227 375,227" fill="none" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="308" y="265" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#087f83">secure route</text>
  <line x1="455" y1="264" x2="455" y2="315" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="482" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#087f83">session</text>
  <polyline points="535,338 612,338 612,199 690,199" fill="none" stroke="#0bb9b0" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="614" y="246" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0bb9b0">checkout command</text>
  <polyline points="535,347 612,347 612,291 690,291" fill="none" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="615" y="314" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#087f83">wallet command</text>
  <polyline points="535,361 612,361 612,371 690,371" fill="none" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="615" y="381" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#087f83">decision request</text>
  <polyline points="850,371 908,371 908,220 965,220" fill="none" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="930" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#087f83">write evidence</text>

  <rect x="90" y="455" width="1000" height="42" rx="10" fill="#fffbd9" stroke="#8bd9cf"/>
  <text x="590" y="481" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#087f83">Mobile or partner channels can call domain APIs through the gateway; Demo BFF is only the web demo orchestrator.</text>
</svg>
