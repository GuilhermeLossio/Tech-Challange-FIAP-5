<svg viewBox="0 0 1120 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe planned demo interface architecture</title>
  <desc id="desc">Planned ECloe Demo interface with ECloe Market, ECloe Pay, ECloe Control Room, a planned backend-for-frontend, the implemented ECloe Engine API, and decision and reward storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1120" height="420" fill="#ffffff"/>
  <text x="560" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328">ECloe Demo Interface Layer</text>

  <rect x="40" y="150" width="150" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="184" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Demo user</text>
  <text x="115" y="206" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Presentation persona</text>

  <rect x="250" y="82" width="360" height="236" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="430" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Planned for demo</text>

  <rect x="280" y="138" width="140" height="56" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">ECloe Market</text>
  <text x="350" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Cart and checkout</text>

  <rect x="280" y="224" width="140" height="56" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">ECloe Pay</text>
  <text x="350" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Wallet benefits</text>

  <rect x="450" y="138" width="130" height="56" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="515" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Control Room</text>
  <text x="515" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Technical view</text>

  <rect x="450" y="224" width="130" height="56" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="515" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Demo BFF</text>
  <text x="515" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Planned layer</text>

  <rect x="690" y="150" width="170" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="775" y="184" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">ECloe Engine</text>
  <text x="775" y="206" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Implemented API</text>

  <rect x="930" y="150" width="150" height="82" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="1005" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Decision and</text>
  <text x="1005" y="199" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">reward storage</text>
  <text x="1005" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Implemented modes</text>

  <line x1="190" y1="191" x2="280" y2="166" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="190" y1="198" x2="280" y2="252" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="420" y1="166" x2="450" y2="252" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="252" x2="450" y2="252" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="515" y1="194" x2="515" y2="224" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="252" x2="690" y2="191" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="860" y1="191" x2="930" y2="191" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="80" y="345" width="960" height="44" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="560" y="372" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a">Eligibility stays upstream. ECloe Engine ranks one eligible offer and records decisions and rewards for future evaluation.</text>
</svg>
