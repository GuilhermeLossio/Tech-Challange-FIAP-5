  <text x="390" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Service layer</text>

  <rect x="400" y="158" width="180" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="490" y="183" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">ECloe BFF</text>
  <text x="490" y="201" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Session boundary</text>

