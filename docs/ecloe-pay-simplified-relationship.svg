  <text x="818" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Azure SQL</text>
  <text x="818" y="193" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">Pay state</text>

  <rect x="728" y="235" width="180" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="818" y="257" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Service Bus</text>
  <text x="818" y="274" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">Event stream</text>

  <rect x="728" y="316" width="180" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="818" y="338" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Cosmos DB</text>
  <text x="818" y="355" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">Decision logs</text>

  <rect x="728" y="397" width="180" height="34" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="818" y="419" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Blob Storage</text>

  <line x1="580" y1="283" x2="728" y2="180" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <line x1="580" y1="283" x2="728" y2="261" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="379" x2="728" y2="342" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="379" x2="728" y2="414" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="145" y="485" width="690" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="490" y="510" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Eligibility remains upstream. ECloe Engine ranks only eligible offers, and ECloe Pay presents the selected wallet benefit.</text>
</svg>
