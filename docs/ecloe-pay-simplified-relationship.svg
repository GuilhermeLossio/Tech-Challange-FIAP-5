  <text x="490" y="375" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Engine API</text>
  <text x="490" y="393" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Decision service</text>

  <line x1="252" y1="323" x2="400" y2="187" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="490" y1="216" x2="490" y2="254" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="490" y1="312" x2="490" y2="350" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>

