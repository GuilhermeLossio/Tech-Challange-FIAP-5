<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe Pay simplified relationships</title>
  <desc id="desc">Simplified ECloe Pay relationships with access boundary, Demo BFF, Pay Transaction API, Engine Decision API, owned stores, Outbox Publisher, Service Bus, and an explicit boundary rule.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1180" height="620" fill="#ffffff"/>
  <text x="590" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">ECloe Pay Simplified Relationships</text>
  <text x="590" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">One owner per store, explicit API calls, and asynchronous event publication after SQL commit.</text>

  <rect x="55" y="120" width="250" height="320" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="80" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Access layer</text>
  <rect x="90" y="190" width="180" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="225" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Demo Web</text>
  <rect x="90" y="300" width="180" height="76" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="180" y="328" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Gateway/Auth</text>
  <text x="180" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">JWT, CSRF, rate</text>
  <text x="180" y="366" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">limit, tracing</text>
  <line x1="180" y1="248" x2="180" y2="300" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <rect x="125" y="262" width="110" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="180" y="280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#2563eb">secure HTTP</text>

  <rect x="380" y="120" width="300" height="320" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="405" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Domain services</text>
  <rect x="430" y="175" width="200" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="530" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Demo BFF</text>
  <text x="530" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">demo orchestration</text>
  <rect x="430" y="280" width="200" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="530" y="307" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Pay Transaction API</text>
  <text x="530" y="327" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">wallet and payment state</text>
  <rect x="430" y="385" width="200" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="530" y="409" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Engine Decision API</text>
  <text x="530" y="428" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">decision and reward</text>
  <polyline points="270,338 340,338 340,209 430,209" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="530" y1="243" x2="530" y2="280" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="530" y1="348" x2="530" y2="385" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="328" y="260" width="126" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="391" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">route request</text>
  <rect x="545" y="252" width="146" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="618" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">wallet command</text>
  <rect x="545" y="355" width="140" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="615" y="373" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">decision call</text>

  <rect x="755" y="120" width="360" height="320" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="780" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Owned stores and events</text>
  <rect x="800" y="175" width="145" height="62" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="872" y="199" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Pay Store</text>
  <text x="872" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">SQL + outbox</text>
  <rect x="970" y="175" width="110" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1025" y="199" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Publisher</text>
  <text x="1025" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">polls</text>
  <rect x="970" y="285" width="110" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1025" y="319" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Service Bus</text>
  <rect x="800" y="285" width="145" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="872" y="309" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Decision Store</text>
  <text x="872" y="328" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">Cosmos DB</text>
  <polyline points="630,314 716,314 716,206 800,206" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <line x1="945" y1="206" x2="970" y2="206" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="1025" y1="237" x2="1025" y2="285" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <polyline points="630,414 720,414 720,314 800,314" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="688" y="250" width="130" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="753" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#2563eb">persist state</text>
  <rect x="960" y="246" width="92" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="1006" y="264" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">publish</text>
  <rect x="678" y="355" width="138" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="747" y="373" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">write evidence</text>

  <rect x="145" y="500" width="890" height="54" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="590" y="524" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Boundary rule</text>
  <text x="590" y="544" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Pay owns wallet state; Engine owns decisions; Service Bus distributes events but writes no storage.</text>
</svg>
