  <rect width="1180" height="620" fill="url(#ecloeBg)"/>
  <text x="590" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14343b">ECloe Pay Simplified Relationships</text>
  <text x="590" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#087f83">One owner per store, explicit API calls, and asynchronous event publication after SQL commit.</text>

  <rect x="55" y="120" width="250" height="320" rx="18" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="80" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#087f83">Access layer</text>
  <rect x="90" y="190" width="180" height="58" rx="10" fill="#d9fff0" stroke="#0bb9b0" stroke-width="1.5" data-card="true"/>
  <use href="#icon-web" transform="translate(98 200) scale(0.30)" color="#0bb9b0" aria-hidden="true"/>
  <text x="138" y="225" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Web</text>
  <rect x="90" y="300" width="180" height="76" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-shield" transform="translate(98 310) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="138" y="328" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Gateway</text>
  <text x="180" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">JWT, CSRF, rate</text>
  <text x="180" y="366" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">limit, tracing</text>
  <line x1="180" y1="248" x2="180" y2="300" stroke="#0bb9b0" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <rect x="125" y="262" width="110" height="26" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="180" y="280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0bb9b0">secure HTTP</text>

  <rect x="380" y="120" width="300" height="320" rx="18" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="405" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#087f83">Domain services</text>
  <rect x="430" y="175" width="200" height="68" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-api" transform="translate(438 185) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="478" y="207" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Demo BFF</text>
  <text x="530" y="227" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">demo orchestration</text>
  <rect x="430" y="280" width="200" height="68" rx="10" fill="#d9fff0" stroke="#0bb9b0" stroke-width="1.5" data-card="true"/>
  <use href="#icon-api" transform="translate(438 290) scale(0.30)" color="#0bb9b0" aria-hidden="true"/>
  <text x="474" y="312" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14343b">Pay Transaction API</text>
  <text x="530" y="332" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">wallet and payment state</text>
  <rect x="430" y="385" width="200" height="58" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-api" transform="translate(438 395) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="474" y="409" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14343b">Engine Decision API</text>
  <text x="530" y="428" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">decision and reward</text>
  <polyline points="270,338 340,338 340,209 430,209" fill="none" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="530" y1="243" x2="530" y2="280" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="530" y1="348" x2="530" y2="385" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="328" y="260" width="126" height="26" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="391" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">route request</text>
  <rect x="545" y="252" width="146" height="26" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="618" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">wallet command</text>
  <rect x="545" y="355" width="140" height="26" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="615" y="373" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">decision call</text>

  <rect x="755" y="120" width="360" height="320" rx="18" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="780" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#087f83">Owned stores and events</text>
  <rect x="800" y="175" width="145" height="62" rx="10" fill="#e5fff7" stroke="#0bb9b0" data-card="true"/>
  <use href="#icon-wallet" transform="translate(808 185) scale(0.30)" color="#0bb9b0" aria-hidden="true"/>
  <text x="844" y="207" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14343b">Pay SQL</text>
  <text x="872" y="226" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#087f83">state + outbox</text>
  <rect x="960" y="175" width="130" height="62" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-bus" transform="translate(1019 181) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="1025" y="220" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14343b">Outbox Publisher</text>
  <rect x="960" y="285" width="130" height="58" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-decision" transform="translate(1019 290) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="1025" y="329" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14343b">Service Bus</text>
  <rect x="800" y="285" width="145" height="58" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-decision" transform="translate(808 295) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="844" y="309" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14343b">Decision Store</text>
  <text x="872" y="328" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#087f83">Cosmos DB</text>
  <polyline points="630,314 716,314 716,206 800,206" fill="none" stroke="#0bb9b0" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <line x1="945" y1="206" x2="960" y2="206" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="1025" y1="237" x2="1025" y2="285" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <polyline points="630,414 720,414 720,314 800,314" fill="none" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="688" y="250" width="130" height="26" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="753" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0bb9b0">persist state</text>
  <rect x="970" y="246" width="110" height="26" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="1025" y="264" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">publish event</text>
  <rect x="678" y="355" width="138" height="26" rx="8" fill="url(#ecloeBg)" stroke="#8bd9cf"/>
  <text x="747" y="373" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">write evidence</text>

  <rect x="145" y="500" width="890" height="54" rx="12" fill="#fffbd9" stroke="#8bd9cf"/>
  <text x="590" y="524" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14343b">Boundary rule</text>
  <text x="590" y="544" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">Pay owns wallet state; Engine owns decisions; Service Bus distributes events but writes no storage.</text>
</svg>
