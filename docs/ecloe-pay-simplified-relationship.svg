<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe Pay simplified relationship</title>
  <desc id="desc">Simplified relationship between ECloe Pay actors, demo channels, API services, event bus, and data stores.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="490" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">ECloe Pay Simplified Relationship</text>
  <text x="490" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Who interacts with whom in the planned wallet demo architecture</text>

  <rect x="40" y="105" width="245" height="345" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="65" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Experience layer</text>

  <rect x="72" y="170" width="180" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="162" y="197" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Customer</text>
  <text x="162" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Uses demo flow</text>

  <rect x="72" y="292" width="180" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="162" y="319" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Demo Web</text>
  <text x="162" y="338" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Market and Pay UI</text>

  <line x1="162" y1="232" x2="162" y2="292" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>

