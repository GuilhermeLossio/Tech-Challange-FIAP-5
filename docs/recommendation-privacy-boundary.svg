<svg viewBox="0 0 1240 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe recommendation privacy boundary</title>
  <desc id="desc">A privacy boundary separates raw Market and Pay state from allowlisted aggregate features. Blocked protected, identifying, precise, and raw financial fields cannot enter Engine, artifacts, or training exports.</desc>
  <defs>
    <linearGradient id="ecloeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffde8"/>
      <stop offset="58%" stop-color="#f7ffb9"/>
      <stop offset="100%" stop-color="#dcfff0"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#247477"/></marker>
    <style>.t{font:700 25px Segoe UI,Arial;fill:#14343b}.s{font:13px Segoe UI,Arial;fill:#3b6b70}.h{font:700 15px Segoe UI,Arial;fill:#14343b}.b{font:12px Segoe UI,Arial;fill:#3b6b70}.l{fill:none;stroke:#247477;stroke-width:2.5;marker-end:url(#a)}</style>
    <g id="icon-web" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="7" width="30" height="23" rx="3"/><path d="M5 14h30M15 35h10M20 30v5"/></g>
    <g id="icon-data" fill="none" stroke="currentColor" stroke-width="2.4"><ellipse cx="20" cy="9" rx="12" ry="5"/><path d="M8 9v20c0 3 5 5 12 5s12-2 12-5V9M8 19c0 3 5 5 12 5s12-2 12-5"/></g>
    <g id="icon-shield" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 5l12 5v9c0 8-5 13-12 16C13 32 8 27 8 19v-9z"/><path d="M14 20l4 4 8-9"/></g>
    <g id="icon-stop" fill="none" stroke="currentColor" stroke-width="2.7"><circle cx="20" cy="20" r="14"/><path d="M10 30l20-20"/></g>
    <g id="icon-engine" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="20" cy="20" r="12"/><path d="M20 4v6M20 30v6M4 20h6M30 20h6"/></g>
  </defs>
  <rect width="1240" height="700" fill="url(#ecloeBg)"/><text x="620" y="45" text-anchor="middle" class="t">Recommendation Privacy Boundary</text><text x="620" y="72" text-anchor="middle" class="s">Data minimization is enforced before serving, training, persistence, and artifact loading.</text>
  <g data-card="true" transform="translate(1045 22)">
    <rect width="150" height="48" rx="8" fill="#fffbd9" stroke="#8bd9cf"/>
    <use href="#icon-web" transform="translate(12 7) scale(.55)" color="#247477"/>
    <text x="55" y="29" class="b">Privacy view</text>
  </g>
  <rect x="40" y="105" width="330" height="500" rx="12" fill="#fffbd9" stroke="#8bd9cf"/><text x="65" y="137" class="h">Domain-owned raw state</text>
  <g transform="translate(70 175)"><rect width="270" height="115" rx="8" fill="url(#ecloeBg)" stroke="#0b9f8f" stroke-width="2.5"/><use href="#icon-data" transform="translate(220 12) scale(.62)" color="#0b9f8f"/><text x="20" y="38" class="h">Market and Pay SQL</text><text x="20" y="68" class="b">Cart, order, payment, wallet,</text><text x="20" y="88" class="b">and detailed domain events</text></g>
  <g transform="translate(70 330)"><rect width="270" height="205" rx="8" fill="#ffe4d8" stroke="#dd6b76" stroke-width="2.5"/><use href="#icon-stop" transform="translate(220 12) scale(.62)" color="#dd6b76"/><text x="20" y="38" class="h">Always blocked</text><text x="20" y="70" class="b">Sex, gender, or inferred proxies</text><text x="20" y="94" class="b">Race, religion, health, ethnicity</text><text x="20" y="118" class="b">Name, email, CPF, address, IP</text><text x="20" y="142" class="b">Income, wealth, balance, score</text><text x="20" y="166" class="b">Precise location and raw history</text><text x="20" y="190" class="b">Full basket or navigation trail</text></g>
  <rect x="430" y="105" width="350" height="500" rx="12" fill="#e5fff7" stroke="#0bb9b0" stroke-width="2.5"/><text x="455" y="137" class="h">Enforcement boundary</text>
  <g transform="translate(470 175)"><rect width="270" height="115" rx="8" fill="url(#ecloeBg)" stroke="#0bb9b0" stroke-width="2.5"/><use href="#icon-shield" transform="translate(220 12) scale(.62)" color="#0bb9b0"/><text x="20" y="38" class="h">Context Builder</text><text x="20" y="68" class="b">Bands, count limits, neutral</text><text x="20" y="88" class="b">categories, pseudonymous key</text></g>
  <g transform="translate(470 330)"><rect width="270" height="205" rx="8" fill="url(#ecloeBg)" stroke="#0bb9b0" stroke-width="2.5"/><use href="#icon-web" transform="translate(220 12) scale(.62)" color="#0bb9b0"/><text x="20" y="38" class="h">Five independent gates</text><text x="20" y="70" class="b">Strict Pydantic API schemas</text><text x="20" y="94" class="b">Runtime feature allowlists</text><text x="20" y="118" class="b">Dataset and export validation</text><text x="20" y="142" class="b">Training column validation</text><text x="20" y="166" class="b">Artifact manifest validation</text><text x="20" y="190" class="b">Automated privacy tests</text></g>
  <rect x="840" y="105" width="360" height="500" rx="12" fill="#e7ffd4" stroke="#0b9f8f"/><text x="865" y="137" class="h">Approved decision data</text>
  <g transform="translate(880 175)"><rect width="280" height="150" rx="8" fill="url(#ecloeBg)" stroke="#0b9f8f" stroke-width="2.5"/><use href="#icon-engine" transform="translate(230 12) scale(.62)" color="#0b9f8f"/><text x="20" y="38" class="h">Engine context</text><text x="20" y="70" class="b">Channel, newbie, recency band</text><text x="20" y="94" class="b">Frequency and history bands</text><text x="20" y="118" class="b">Market or Pay surface fields</text><text x="20" y="140" class="b">No arbitrary context maps</text></g>
  <g transform="translate(880 365)"><rect width="280" height="170" rx="8" fill="url(#ecloeBg)" stroke="#0b9f8f" stroke-width="2.5"/><use href="#icon-data" transform="translate(230 12) scale(.62)" color="#0b9f8f"/><text x="20" y="38" class="h">Governed stores</text><text x="20" y="70" class="b">Aggregated SQL snapshots</text><text x="20" y="94" class="b">Minimized Cosmos decisions</text><text x="20" y="118" class="b">Binary verified outcomes</text><text x="20" y="142" class="b">Versioned feature manifests</text><text x="20" y="162" class="b">Checksummed artifacts</text></g>
  <path d="M370 250H430" class="l"/><path d="M780 250H840" class="l"/>
  <path d="M370 430H405" fill="none" stroke="#dd6b76" stroke-width="4"/><circle cx="412" cy="430" r="7" fill="#dd6b76"/>
  <text x="620" y="653" text-anchor="middle" class="s">Protected attributes are not collected, so direct parity by those attributes is not claimed.</text>
</svg>
