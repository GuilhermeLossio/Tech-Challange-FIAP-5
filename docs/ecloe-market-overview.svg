<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe Market real-ready overview</title>
  <desc id="desc">ECloe Market architecture showing Demo Web, API Gateway, Demo BFF, Market Transaction API, Pay Transaction API, Engine Decision API, Market Transaction Store with outbox row, Outbox Publisher, Service Bus, projections, exports, security, and observability.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">ECloe Market Real-Ready Overview</text>
  <text x="640" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Market owns catalog, cart, checkout, inventory, orders, and the transactional outbox</text>

  <rect x="40" y="105" width="250" height="455" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="65" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Experience and perimeter</text>
  <rect x="75" y="165" width="180" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="165" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Demo Web</text>
  <text x="165" y="211" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Market, Pay, Control</text>
  <rect x="75" y="280" width="180" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="165" y="307" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">API Gateway</text>
  <text x="165" y="327" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">auth, rate limit,</text>
  <text x="165" y="345" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">correlation ID</text>
  <rect x="75" y="410" width="180" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="165" y="438" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Demo BFF</text>
  <text x="165" y="458" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">session and context</text>
  <text x="165" y="476" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">aggregation</text>
  <line x1="165" y1="227" x2="165" y2="280" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="204" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">HTTPS</text>
  <line x1="165" y1="352" x2="165" y2="410" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="194" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">route</text>

  <rect x="350" y="105" width="315" height="455" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="375" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Domain APIs</text>
  <rect x="405" y="170" width="205" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="507" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Market Transaction API</text>
  <text x="507" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">catalog, cart, order</text>
  <rect x="405" y="295" width="205" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="507" y="322" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Pay Transaction API</text>
  <text x="507" y="342" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">payment confirmation</text>
  <rect x="405" y="420" width="205" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="507" y="447" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Engine Decision API</text>
  <text x="507" y="467" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">rank eligible offers</text>
  <polyline points="255,446 330,446 330,206 405,206" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="329" y="306" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">checkout command</text>
  <line x1="507" y1="242" x2="507" y2="295" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="535" y="273" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">confirm payment</text>
  <line x1="507" y1="363" x2="507" y2="420" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="535" y="397" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">request decision</text>

  <rect x="735" y="105" width="490" height="455" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="760" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">State and integration</text>
  <rect x="780" y="170" width="190" height="78" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="875" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Market Store</text>
  <text x="875" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Azure SQL</text>
  <text x="875" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">order + outbox row</text>
  <rect x="1015" y="170" width="160" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1095" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Outbox Publisher</text>
  <text x="1095" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">polls SQL outbox</text>
  <rect x="1015" y="320" width="160" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1095" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Service Bus</text>
  <text x="1095" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">domain events</text>
  <rect x="780" y="320" width="190" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="875" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Projection Store</text>
  <text x="875" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Cosmos read models</text>
  <rect x="780" y="455" width="190" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="875" y="483" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Export Service</text>
  <text x="875" y="503" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">reports and evidence</text>
  <rect x="1015" y="455" width="160" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1095" y="483" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Blob Storage</text>
  <text x="1095" y="503" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">exports only</text>
  <polyline points="610,206 695,206 695,209 780,209" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="695" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">commit order transaction</text>
  <line x1="970" y1="209" x2="1015" y2="209" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="993" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">poll</text>
  <line x1="1095" y1="248" x2="1095" y2="320" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1122" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">publish</text>
  <line x1="1015" y1="354" x2="970" y2="354" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="993" y="340" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">consume</text>
  <line x1="970" y1="489" x2="1015" y2="489" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="993" y="475" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">upload</text>

  <rect x="70" y="610" width="520" height="58" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="330" y="635" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Security</text>
  <text x="330" y="654" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Gateway, auth scopes, request validation, idempotency, and Key Vault secrets</text>
  <rect x="690" y="610" width="520" height="58" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="950" y="635" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Observability</text>
  <text x="950" y="654" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Structured logs, metrics, traces, dead-letter monitoring, and correlation IDs</text>
</svg>
