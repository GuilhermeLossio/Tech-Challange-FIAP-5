  <use href="#icon-cart" transform="translate(788 180) scale(0.30)" color="#2563eb" aria-hidden="true"/>
  <text x="828" y="198" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Market Store</text>
  <text x="875" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Azure SQL</text>
  <text x="875" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">order + outbox row</text>
  <rect x="1015" y="170" width="160" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-database" transform="translate(1023 180) scale(0.30)" color="#57606a" aria-hidden="true"/>
