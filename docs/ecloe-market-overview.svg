  <text x="1095" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">polls SQL outbox</text>
  <rect x="1015" y="320" width="160" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-decision" transform="translate(1023 330) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="1063" y="352" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Bus</text>
  <text x="1095" y="372" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">domain events</text>
  <rect x="780" y="320" width="190" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-decision" transform="translate(788 330) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="828" y="352" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Projection</text>
  <text x="875" y="372" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Cosmos read models</text>
  <rect x="780" y="455" width="190" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-worker" transform="translate(788 465) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="828" y="487" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Export</text>
  <text x="875" y="507" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">reports and evidence</text>
  <rect x="1015" y="455" width="160" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-cart" transform="translate(1023 465) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="1063" y="487" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Blob</text>
  <text x="1095" y="507" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">exports only</text>
  <polyline points="610,206 695,206 695,209 780,209" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="695" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">commit order transaction</text>
  <line x1="970" y1="209" x2="1015" y2="209" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="993" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">poll</text>
  <line x1="1095" y1="248" x2="1095" y2="320" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1122" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">publish</text>
  <line x1="1015" y1="354" x2="970" y2="354" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="993" y="340" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">consume</text>
  <line x1="970" y1="489" x2="1015" y2="489" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="993" y="475" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">upload</text>

  <rect x="70" y="610" width="520" height="58" rx="12" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-shield" transform="translate(81 620) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="330" y="635" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Security</text>
  <text x="330" y="654" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Gateway, auth scopes, request validation, idempotency, and Key Vault secrets</text>
  <rect x="690" y="610" width="520" height="58" rx="12" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-eye" transform="translate(701 620) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="950" y="635" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Observability</text>
  <text x="950" y="654" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Structured logs, metrics, traces, dead-letter monitoring, and correlation IDs</text>
</svg>
