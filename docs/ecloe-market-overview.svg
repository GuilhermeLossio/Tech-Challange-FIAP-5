  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">ECloe Market Real-Ready Overview</text>
  <text x="640" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Market owns catalog, cart, checkout, inventory, orders, and the transactional outbox</text>

  <rect x="40" y="105" width="250" height="455" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="65" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Experience and perimeter</text>
  <rect x="75" y="165" width="180" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" data-card="true"/>
  <use href="#icon-web" transform="translate(83 175) scale(0.30)" color="#2563eb" aria-hidden="true"/>
  <text x="123" y="197" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Web</text>
  <text x="165" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Market, Pay, Control</text>
  <rect x="75" y="280" width="180" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-shield" transform="translate(83 290) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="123" y="307" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">API Gateway</text>
  <text x="165" y="327" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">auth, rate limit,</text>
  <text x="165" y="345" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">correlation ID</text>
  <rect x="75" y="410" width="180" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-api" transform="translate(83 420) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="123" y="438" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Demo BFF</text>
  <text x="165" y="458" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">session and context</text>
  <text x="165" y="476" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">aggregation</text>
  <line x1="165" y1="227" x2="165" y2="280" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="204" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">HTTPS</text>
  <line x1="165" y1="352" x2="165" y2="410" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="194" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">route</text>

  <rect x="350" y="105" width="315" height="455" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="375" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Domain APIs</text>
  <rect x="405" y="170" width="205" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" data-card="true"/>
  <use href="#icon-api" transform="translate(413 180) scale(0.30)" color="#2563eb" aria-hidden="true"/>
  <text x="453" y="202" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Market API</text>
  <text x="507" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">catalog, cart, order</text>
  <rect x="405" y="295" width="205" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-api" transform="translate(413 305) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="453" y="327" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Pay API</text>
  <text x="507" y="347" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">payment confirmation</text>
