  <text x="507" y="472" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">rank eligible offers</text>
  <polyline points="255,446 330,446 330,206 405,206" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="329" y="306" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">checkout command</text>
  <line x1="507" y1="242" x2="507" y2="295" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="535" y="273" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">confirm payment</text>
  <line x1="507" y1="363" x2="507" y2="420" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="535" y="397" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">request decision</text>

  <rect x="735" y="105" width="490" height="455" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="760" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">State and integration</text>
