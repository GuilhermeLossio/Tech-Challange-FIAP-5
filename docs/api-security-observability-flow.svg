<svg viewBox="0 0 1240 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe API security and observability flow</title>
  <desc id="desc">Security and observability flow for ECloe Engine Decision API with orthogonal connectors. API clients send requests through the API Gateway and Auth boundary, Host and CORS checks lead to Entra ID scope checks, valid requests reach Engine routers, redacted telemetry reaches Application Insights, and CI gates feed continuous assurance without crossing the legend.</desc>
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .titleText { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #1f2328; font-weight: 700; }
      .sectionText { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #57606a; font-size: 13px; font-weight: 700; }
      .bodyText { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #57606a; font-size: 12px; }
      .cardTitle { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 15px; font-weight: 700; }
      .cardSub { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #57606a; font-size: 11.5px; }
      .pillText { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #57606a; font-size: 11.5px; font-weight: 700; }
      .labelText { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #57606a; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1240" height="700" fill="#ffffff"/>
  <text x="620" y="46" text-anchor="middle" class="titleText" font-size="24">ECloe - API Security and Observability Flow</text>
  <text x="620" y="74" text-anchor="middle" class="bodyText" font-size="13">Gateway controls, authentication, business execution, telemetry, and CI assurance with non-overlapping orthogonal flows.</text>

  <rect x="40" y="112" width="238" height="330" rx="18" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="70" y="140" class="sectionText">Client and Token</text>
  <rect x="72" y="178" width="174" height="198" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="159" y="224" text-anchor="middle" class="cardTitle">API Client</text>
  <text x="159" y="254" text-anchor="middle" class="cardSub">Bearer token,</text>
  <text x="159" y="272" text-anchor="middle" class="cardSub">request_id, trace_id,</text>
  <text x="159" y="290" text-anchor="middle" class="cardSub">and minimized context</text>
  <rect x="100" y="328" width="118" height="24" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="159" y="344" text-anchor="middle" class="pillText">no raw PII log</text>

  <rect x="326" y="112" width="266" height="330" rx="18" fill="#f8fbff" stroke="#c6d6f4" stroke-width="2"/>
  <text x="356" y="140" class="sectionText">API Gateway / Auth Boundary</text>
  <rect x="358" y="168" width="202" height="106" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="459" y="207" text-anchor="middle" class="cardTitle">Host and CORS</text>
  <text x="459" y="235" text-anchor="middle" class="cardSub">Trusted host and</text>
  <text x="459" y="253" text-anchor="middle" class="cardSub">explicit origins</text>
  <rect x="358" y="304" width="202" height="106" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="459" y="343" text-anchor="middle" class="cardTitle">Abuse Controls</text>
  <text x="459" y="371" text-anchor="middle" class="cardSub">Payload size, rate,</text>
  <text x="459" y="389" text-anchor="middle" class="cardSub">and concurrency limits</text>

  <rect x="640" y="112" width="250" height="330" rx="18" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="670" y="140" class="sectionText">Business Execution</text>
  <rect x="672" y="168" width="186" height="106" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="765" y="207" text-anchor="middle" class="cardTitle">Entra ID Auth</text>
  <text x="765" y="235" text-anchor="middle" class="cardSub">Validates JWT claims</text>
  <text x="765" y="253" text-anchor="middle" class="cardSub">and required scopes</text>
  <rect x="672" y="304" width="186" height="106" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="765" y="343" text-anchor="middle" class="cardTitle">Engine Routers</text>
  <text x="765" y="371" text-anchor="middle" class="cardSub">Decision, likelihood,</text>
  <text x="765" y="389" text-anchor="middle" class="cardSub">policy, and reward</text>

  <rect x="938" y="112" width="262" height="330" rx="18" fill="#f8fbff" stroke="#c6d6f4" stroke-width="2"/>
  <text x="968" y="140" class="sectionText">Telemetry Sink</text>
  <rect x="970" y="168" width="198" height="106" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1069" y="207" text-anchor="middle" class="cardTitle">Structured Logs</text>
  <text x="1069" y="235" text-anchor="middle" class="cardSub">Route, status, latency,</text>
  <text x="1069" y="253" text-anchor="middle" class="cardSub">decision and trace IDs</text>
  <rect x="970" y="304" width="198" height="106" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="1069" y="343" text-anchor="middle" class="cardTitle">OpenTelemetry</text>
  <text x="1069" y="371" text-anchor="middle" class="cardSub">Exports redacted spans</text>
  <text x="1069" y="389" text-anchor="middle" class="cardSub">to Application Insights</text>

  <polyline points="246,277 300,277 300,357 326,357" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
  <text x="300" y="263" text-anchor="middle" class="labelText">HTTPS</text>
  <polyline points="560,221 600,221 600,221 672,221" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrowGray)"/>
  <text x="616" y="207" text-anchor="middle" class="labelText">scope check</text>
  <polyline points="560,357 600,357 600,357 672,357" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
  <text x="616" y="343" text-anchor="middle" class="labelText">valid request</text>
  <polyline points="858,357 910,357 910,221 970,221" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
  <text x="914" y="207" text-anchor="middle" class="labelText">redacted logs</text>

  <rect x="118" y="470" width="1004" height="34" rx="17" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="144" cy="487" r="6" fill="#2563eb"/>
  <text x="162" y="491" class="bodyText">Business routes require token scopes in cloud; local disabled auth is limited to 127.0.0.1.</text>
  <circle cx="780" cy="487" r="6" fill="#57606a"/>
  <text x="798" y="491" class="bodyText">Customer context is minimized and excluded from access logs.</text>

  <rect x="480" y="526" width="280" height="30" rx="15" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="620" y="546" text-anchor="middle" class="labelText">continuous assurance</text>

  <g transform="translate(90 590)">
    <rect width="1060" height="70" rx="18" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <text x="32" y="30" class="sectionText">CI gates</text>
    <rect x="114" y="18" width="140" height="34" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <text x="184" y="39" text-anchor="middle" class="pillText">Ruff</text>
    <rect x="270" y="18" width="140" height="34" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <text x="340" y="39" text-anchor="middle" class="pillText">pytest + cov</text>
    <rect x="426" y="18" width="140" height="34" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <text x="496" y="39" text-anchor="middle" class="pillText">pip-audit</text>
    <rect x="582" y="18" width="140" height="34" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <text x="652" y="39" text-anchor="middle" class="pillText">OpenAPI</text>
    <rect x="738" y="18" width="140" height="34" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <text x="808" y="39" text-anchor="middle" class="pillText">CodeQL</text>
    <rect x="894" y="18" width="140" height="34" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <text x="964" y="39" text-anchor="middle" class="pillText">secret scanning</text>
  </g>
  <polyline points="620,590 620,566 620,556" fill="none" stroke="#57606a" stroke-width="2.2" stroke-dasharray="6 6" marker-end="url(#arrowGray)"/>
</svg>
