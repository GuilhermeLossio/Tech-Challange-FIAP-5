<svg viewBox="0 0 1180 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe Market checkout and order flow</title>
  <desc id="desc">Checkout and order flow for ECloe Market from cart confirmation through Azure SQL transaction, Pay confirmation, recommendation, outbox, and Service Bus events.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1180" height="470" fill="#ffffff"/>
  <text x="590" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">ECloe Market Checkout Flow</text>
  <text x="590" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Planned transactional order creation with eligibility, recommendation, payment confirmation, and outbox publication</text>

  <rect x="40" y="110" width="130" height="92" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="65" cy="136" r="14" fill="#2563eb"/>
  <text x="65" y="141" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="105" y="139" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Cart</text>
  <text x="105" y="163" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Customer starts</text>
  <text x="105" y="181" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">checkout</text>

  <rect x="215" y="110" width="150" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="240" cy="136" r="14" fill="#57606a"/>
  <text x="240" y="141" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="290" y="139" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">BFF</text>
  <text x="290" y="163" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Orchestrates</text>
  <text x="290" y="181" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">session</text>

  <rect x="410" y="110" width="150" height="92" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="435" cy="136" r="14" fill="#2563eb"/>
  <text x="435" y="141" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="485" y="139" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Market API</text>
  <text x="485" y="163" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Validates cart</text>
  <text x="485" y="181" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">and prices</text>

  <rect x="605" y="110" width="150" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="630" cy="136" r="14" fill="#57606a"/>
  <text x="630" y="141" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="680" y="139" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Azure SQL</text>
  <text x="680" y="163" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Order, stock</text>
  <text x="680" y="181" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">and outbox</text>

  <rect x="800" y="110" width="150" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="825" cy="136" r="14" fill="#57606a"/>
  <text x="825" y="141" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="875" y="139" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Pay API</text>
  <text x="875" y="163" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Simulates</text>
  <text x="875" y="181" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">payment</text>

  <rect x="995" y="110" width="145" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="1020" cy="136" r="14" fill="#57606a"/>
  <text x="1020" y="141" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">6</text>
  <text x="1068" y="139" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Engine API</text>
  <text x="1068" y="163" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Ranks eligible</text>
  <text x="1068" y="181" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">offers</text>

  <line x1="170" y1="156" x2="215" y2="156" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <line x1="365" y1="156" x2="410" y2="156" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="560" y1="156" x2="605" y2="156" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="755" y1="156" x2="800" y2="156" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="950" y1="156" x2="995" y2="156" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="90" y="285" width="210" height="68" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="195" y="311" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Checkout snapshot</text>
  <text x="195" y="331" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Aggregated context and</text>
  <text x="195" y="349" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">eligible offers only</text>

  <rect x="365" y="285" width="210" height="68" rx="12" fill="#eff6ff" stroke="#2563eb"/>
  <text x="470" y="311" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Order transaction</text>
  <text x="470" y="331" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Reserve stock and create</text>
  <text x="470" y="349" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">order plus outbox row</text>

  <rect x="640" y="285" width="210" height="68" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="745" y="311" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Outbox Worker</text>
  <text x="745" y="331" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Publishes confirmed</text>
  <text x="745" y="349" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">domain events</text>

  <rect x="915" y="285" width="210" height="68" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1020" y="311" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Service Bus</text>
  <text x="1020" y="331" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Delivers events to Pay,</text>
  <text x="1020" y="349" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Engine, and projections</text>

  <path d="M 485 202 C 485 248, 470 248, 470 285" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <line x1="575" y1="319" x2="640" y2="319" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="850" y1="319" x2="915" y2="319" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M 995 178 C 800 250, 520 250, 300 319" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="90" y="392" width="1035" height="34" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="607" y="414" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">If price, stock, idempotency, or payment confirmation fails, Market keeps the order boundary explicit and does not ask Engine to decide business validity.</text>
</svg>
