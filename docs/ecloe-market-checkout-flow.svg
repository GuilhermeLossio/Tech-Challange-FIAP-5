<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe Market checkout flow</title>
  <desc id="desc">ECloe Market checkout flow showing cart validation, order transaction, payment confirmation through Pay Transaction API, eligible-offer decision request to Engine Decision API, transactional outbox row in Azure SQL, Outbox Publisher polling, and Service Bus publication.</desc>
  <defs>
    <linearGradient id="ecloeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffde8"/>
      <stop offset="58%" stop-color="#f7ffb9"/>
      <stop offset="100%" stop-color="#dcfff0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087f83"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0bb9b0"/>
    </marker>

    <g id="icon-web" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="9" width="26" height="19" rx="3"/>
      <path d="M7 15h26M15 33h10M20 28v5"/>
    </g>
    <g id="icon-shield" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 5l12 5v9c0 8-5 13-12 16C13 32 8 27 8 19v-9l12-5z"/>
      <path d="M15 20l4 4 7-8"/>
    </g>
    <g id="icon-api" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 12l-7 8 7 8M27 12l7 8-7 8M23 9l-6 22"/>
    </g>
    <g id="icon-wallet" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 13h24a4 4 0 0 1 4 4v13H9a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4h20v5"/>
      <path d="M27 22h8M29 22h1"/>
    </g>
    <g id="icon-cart" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8h4l4 17h16l4-12H13"/>
      <circle cx="17" cy="32" r="2.4"/>
      <circle cx="29" cy="32" r="2.4"/>
    </g>
    <g id="icon-decision" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 13h8M8 27h8M24 20h8"/>
      <circle cx="20" cy="13" r="4"/>
      <circle cx="20" cy="27" r="4"/>
      <circle cx="20" cy="20" r="4"/>
    </g>
    <g id="icon-database" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="20" cy="10" rx="12" ry="5"/>
      <path d="M8 10v18c0 3 5 5 12 5s12-2 12-5V10"/>
      <path d="M8 19c0 3 5 5 12 5s12-2 12-5"/>
    </g>
    <g id="icon-bus" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="10" width="26" height="20" rx="4"/>
      <path d="M11 16h18M11 22h12"/>
      <path d="M14 34v-4M26 34v-4"/>
    </g>
    <g id="icon-worker" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="5"/>
      <path d="M20 6v5M20 29v5M6 20h5M29 20h5M10 10l4 4M26 26l4 4M30 10l-4 4M14 26l-4 4"/>
    </g>
    <g id="icon-artifact" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 12h10l3 4h13v15H7z"/>
      <path d="M15 25h10M20 20v10"/>
    </g>
    <g id="icon-chart" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 31h24"/>
      <rect x="10" y="20" width="5" height="11" rx="1"/>
      <rect x="18" y="14" width="5" height="17" rx="1"/>
      <rect x="26" y="9" width="5" height="22" rx="1"/>
    </g>
    <g id="icon-doc" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6h12l6 6v22H12z"/>
      <path d="M24 6v8h6M16 20h12M16 26h12"/>
    </g>
    <g id="icon-eye" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 20s6-9 15-9 15 9 15 9-6 9-15 9-15-9-15-9z"/>
      <circle cx="20" cy="20" r="4"/>
    </g>
  </defs>
  <rect width="1280" height="560" fill="url(#ecloeBg)"/>
  <text x="640" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14343b">ECloe Market Checkout Flow</text>
  <text x="640" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#087f83">Engine ranks eligible offers only after Market validates cart/order and Pay confirms payment state</text>

  <rect x="40" y="122" width="140" height="96" rx="12" fill="#d9fff0" stroke="#0bb9b0" stroke-width="1.5" data-card="true"/>
  <use href="#icon-shield" transform="translate(48 132) scale(0.30)" color="#0bb9b0" aria-hidden="true"/>
  <text x="88" y="154" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Cart</text>
  <text x="110" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">customer starts</text>
  <text x="110" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">checkout</text>
  <rect x="220" y="122" width="145" height="96" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-shield" transform="translate(228 132) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="268" y="154" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Gateway</text>
  <text x="292" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">auth, rate limit,</text>
  <text x="292" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">correlation ID</text>
  <rect x="405" y="122" width="145" height="96" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-api" transform="translate(413 132) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="453" y="154" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Demo BFF</text>
  <text x="477" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">orchestrates</text>
  <text x="477" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">demo session</text>
  <rect x="590" y="122" width="170" height="96" rx="12" fill="#d9fff0" stroke="#0bb9b0" stroke-width="1.5" data-card="true"/>
  <use href="#icon-api" transform="translate(669 122) scale(0.30)" color="#0bb9b0" aria-hidden="true"/>
  <text x="675" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14343b">Market Transaction API</text>
  <text x="675" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">validates cart,</text>
  <text x="675" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">price, stock</text>
  <rect x="805" y="122" width="160" height="96" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-api" transform="translate(879 122) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="885" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14343b">Pay Transaction API</text>
  <text x="885" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">confirms payment</text>
  <text x="885" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">state</text>
  <rect x="1010" y="122" width="170" height="96" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-api" transform="translate(1089 122) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="1095" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14343b">Engine Decision API</text>
  <text x="1095" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">ranks already</text>
  <text x="1095" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">eligible offers</text>

  <line x1="180" y1="170" x2="220" y2="170" stroke="#0bb9b0" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="200" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0bb9b0">submit</text>
  <line x1="365" y1="170" x2="405" y2="170" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="385" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">route</text>
  <line x1="550" y1="170" x2="590" y2="170" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="570" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">checkout</text>
  <line x1="760" y1="150" x2="805" y2="150" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="782" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">payment check</text>
  <line x1="805" y1="190" x2="760" y2="190" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="782" y="213" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">status</text>
  <line x1="760" y1="170" x2="1010" y2="170" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="885" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">minimized context + eligible offers</text>

  <rect x="125" y="315" width="220" height="82" rx="12" fill="#e5fff7" stroke="#0bb9b0" data-card="true"/>
  <use href="#icon-cart" transform="translate(133 325) scale(0.30)" color="#0bb9b0" aria-hidden="true"/>
  <text x="169" y="347" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14343b">Market SQL + Outbox</text>
  <text x="235" y="369" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">Azure SQL transaction</text>
  <text x="235" y="387" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">order + outbox row</text>
  <rect x="455" y="315" width="190" height="82" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-bus" transform="translate(463 325) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="499" y="347" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14343b">Outbox Publisher</text>
  <text x="550" y="369" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">polls committed</text>
  <text x="550" y="387" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">outbox rows</text>
  <rect x="755" y="315" width="170" height="82" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-decision" transform="translate(763 325) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="799" y="347" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14343b">Service Bus</text>
  <text x="840" y="369" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">confirmed domain</text>
  <text x="840" y="387" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">events</text>
  <rect x="1035" y="315" width="170" height="82" rx="12" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-decision" transform="translate(1114 315) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="1120" y="347" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#14343b">Decision/Reward Store</text>
  <text x="1120" y="369" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">Engine decision</text>
  <text x="1120" y="387" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">evidence</text>

  <polyline points="675,218 675,270 235,270 235,315" fill="none" stroke="#0bb9b0" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="460" y="267" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0bb9b0">commit order and outbox atomically</text>
  <line x1="345" y1="356" x2="455" y2="356" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="400" y="342" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">poll/read</text>
  <line x1="645" y1="356" x2="755" y2="356" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="700" y="342" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">publish</text>
  <polyline points="1095,218 1095,270 1120,270 1120,315" fill="none" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1152" y="267" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#087f83">write decision</text>

  <rect x="90" y="455" width="1100" height="48" rx="10" fill="#fffbd9" stroke="#8bd9cf"/>
  <text x="640" y="485" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#087f83">Engine does not validate price, stock, payment authorization, fraud, risk, credit, or eligibility; those checks stay upstream.</text>
</svg>
