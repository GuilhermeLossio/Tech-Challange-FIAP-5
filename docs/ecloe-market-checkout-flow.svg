<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe Market checkout flow</title>
  <desc id="desc">ECloe Market checkout flow showing cart validation, order transaction, payment confirmation through Pay Transaction API, eligible-offer decision request to Engine Decision API, transactional outbox row in Azure SQL, Outbox Publisher polling, and Service Bus publication.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1280" height="560" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">ECloe Market Checkout Flow</text>
  <text x="640" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Engine ranks eligible offers only after Market validates cart/order and Pay confirms payment state</text>

  <rect x="40" y="122" width="140" height="96" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Cart</text>
  <text x="110" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">customer starts</text>
  <text x="110" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">checkout</text>
  <rect x="220" y="122" width="145" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="292" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Gateway/Auth</text>
  <text x="292" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">auth, rate limit,</text>
  <text x="292" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">correlation ID</text>
  <rect x="405" y="122" width="145" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="477" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Demo BFF</text>
  <text x="477" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">orchestrates</text>
  <text x="477" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">demo session</text>
  <rect x="590" y="122" width="170" height="96" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="675" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Market API</text>
  <text x="675" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">validates cart,</text>
  <text x="675" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">price, stock</text>
  <rect x="805" y="122" width="160" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="885" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Pay Transaction API</text>
  <text x="885" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">confirms payment</text>
  <text x="885" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">state</text>
  <rect x="1010" y="122" width="170" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1095" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Engine Decision API</text>
  <text x="1095" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">ranks already</text>
  <text x="1095" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">eligible offers</text>

  <line x1="180" y1="170" x2="220" y2="170" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="200" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#2563eb">submit</text>
  <line x1="365" y1="170" x2="405" y2="170" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="385" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">route</text>
  <line x1="550" y1="170" x2="590" y2="170" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="570" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">checkout</text>
  <line x1="760" y1="150" x2="805" y2="150" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="782" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">payment check</text>
  <line x1="805" y1="190" x2="760" y2="190" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="782" y="213" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">status</text>
  <line x1="760" y1="170" x2="1010" y2="170" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="885" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">minimized context + eligible offers</text>

  <rect x="125" y="315" width="220" height="82" rx="12" fill="#eff6ff" stroke="#2563eb"/>
  <text x="235" y="343" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Market Store</text>
  <text x="235" y="365" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Azure SQL transaction</text>
  <text x="235" y="383" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">order + outbox row</text>
  <rect x="455" y="315" width="190" height="82" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="550" y="343" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Outbox Publisher</text>
  <text x="550" y="365" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">polls committed</text>
  <text x="550" y="383" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">outbox rows</text>
  <rect x="755" y="315" width="170" height="82" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="840" y="347" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Service Bus</text>
  <text x="840" y="369" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">confirmed domain</text>
  <text x="840" y="387" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">events</text>
  <rect x="1035" y="315" width="170" height="82" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1120" y="347" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Decision Store</text>
  <text x="1120" y="369" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Engine decision</text>
  <text x="1120" y="387" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">evidence</text>

  <polyline points="675,218 675,270 235,270 235,315" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="460" y="267" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#2563eb">commit order and outbox atomically</text>
  <line x1="345" y1="356" x2="455" y2="356" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="400" y="342" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">poll/read</text>
  <line x1="645" y1="356" x2="755" y2="356" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="700" y="342" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">publish</text>
  <polyline points="1095,218 1095,270 1120,270 1120,315" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1152" y="267" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" fill="#57606a">write decision</text>

  <rect x="90" y="455" width="1100" height="48" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="640" y="485" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Engine does not validate price, stock, payment authorization, fraud, risk, credit, or eligibility; those checks stay upstream.</text>
</svg>
