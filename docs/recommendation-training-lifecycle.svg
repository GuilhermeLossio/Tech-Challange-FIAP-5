<svg viewBox="0 0 1240 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe recommendation training lifecycle</title>
  <desc id="desc">Chronological batch training lifecycle from governed export through privacy validation, temporal split, separate Market and Pay artifacts, evaluation, shadow review, manual promotion, and rollback.</desc>
  <defs>
    <linearGradient id="ecloeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffde8"/>
      <stop offset="58%" stop-color="#f7ffb9"/>
      <stop offset="100%" stop-color="#dcfff0"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#247477"/></marker>
    <style>.t{font:700 25px Segoe UI,Arial;fill:#14343b}.s{font:13px Segoe UI,Arial;fill:#3b6b70}.h{font:700 14px Segoe UI,Arial;fill:#14343b}.b{font:12px Segoe UI,Arial;fill:#3b6b70}.l{fill:none;stroke:#247477;stroke-width:2.5;marker-end:url(#a)}</style>
    <g id="icon-web" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="7" width="30" height="23" rx="3"/><path d="M5 14h30M15 35h10M20 30v5"/></g>
    <g id="icon-data" fill="none" stroke="currentColor" stroke-width="2.4"><ellipse cx="20" cy="9" rx="12" ry="5"/><path d="M8 9v20c0 3 5 5 12 5s12-2 12-5V9M8 19c0 3 5 5 12 5s12-2 12-5"/></g>
    <g id="icon-shield" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 5l12 5v9c0 8-5 13-12 16C13 32 8 27 8 19v-9z"/><path d="M14 20l4 4 8-9"/></g>
    <g id="icon-clock" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="20" cy="20" r="14"/><path d="M20 11v10l7 4"/></g>
    <g id="icon-chart" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 33h28M10 30V21h6v9M19 30V14h6v16M28 30V8h6v22"/></g>
    <g id="icon-file" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M11 5h14l6 6v24H11zM25 5v8h6M16 21h10M16 27h10"/></g>
    <g id="icon-eye" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 20s6-9 16-9 16 9 16 9-6 9-16 9S4 20 4 20z"/><circle cx="20" cy="20" r="4"/></g>
  </defs>
  <rect width="1240" height="690" fill="url(#ecloeBg)"/><text x="620" y="45" text-anchor="middle" class="t">Recommendation Training Lifecycle</text><text x="620" y="72" text-anchor="middle" class="s">Market and Pay are trained, evaluated, promoted, and rolled back independently.</text>
  <g data-card="true" transform="translate(1045 22)">
    <rect width="150" height="48" rx="8" fill="#fffbd9" stroke="#8bd9cf"/>
    <use href="#icon-web" transform="translate(12 7) scale(.55)" color="#247477"/>
    <text x="55" y="29" class="b">Batch only</text>
  </g>
  <g transform="translate(55 125)"><rect width="210" height="112" rx="8" fill="#fff0d1" stroke="#f08d78" stroke-width="2.5"/><use href="#icon-data" transform="translate(160 12) scale(.62)" color="#f08d78"/><text x="20" y="38" class="h">1. Governed export</text><text x="20" y="68" class="b">Cosmos outcomes plus</text><text x="20" y="88" class="b">approved SQL views</text></g>
  <g transform="translate(355 125)"><rect width="210" height="112" rx="8" fill="#ffe4d8" stroke="#dd6b76" stroke-width="2.5"/><use href="#icon-shield" transform="translate(160 12) scale(.62)" color="#dd6b76"/><text x="20" y="38" class="h">2. Privacy gate</text><text x="20" y="68" class="b">Allowlist, manifest,</text><text x="20" y="88" class="b">blocked-field scan</text></g>
  <g transform="translate(655 125)"><rect width="210" height="112" rx="8" fill="#e5fff7" stroke="#0bb9b0" stroke-width="2.5"/><use href="#icon-clock" transform="translate(160 12) scale(.62)" color="#0bb9b0"/><text x="20" y="38" class="h">3. Temporal split</text><text x="20" y="68" class="b">Train, validation, test</text><text x="20" y="88" class="b">with no future leakage</text></g>
  <g transform="translate(955 125)"><rect width="230" height="112" rx="8" fill="#e9e8ff" stroke="#6976c7" stroke-width="2.5"/><use href="#icon-file" transform="translate(180 12) scale(.62)" color="#6976c7"/><text x="20" y="38" class="h">4. Separate artifacts</text><text x="20" y="68" class="b">Market purchase model</text><text x="20" y="88" class="b">Pay acceptance model</text></g>
  <g transform="translate(805 355)"><rect width="230" height="112" rx="8" fill="#e7ffd4" stroke="#0b9f8f" stroke-width="2.5"/><use href="#icon-chart" transform="translate(180 12) scale(.62)" color="#0b9f8f"/><text x="20" y="38" class="h">5. Evaluation gates</text><text x="20" y="68" class="b">Objective, calibration,</text><text x="20" y="88" class="b">coverage, regret, safety</text></g>
  <g transform="translate(505 355)"><rect width="230" height="112" rx="8" fill="#e5fff7" stroke="#0bb9b0" stroke-width="2.5"/><use href="#icon-eye" transform="translate(180 12) scale(.62)" color="#0bb9b0"/><text x="20" y="38" class="h">6. Shadow review</text><text x="20" y="68" class="b">No presentation impact</text><text x="20" y="88" class="b">No causal uplift claim</text></g>
  <g transform="translate(205 355)"><rect width="230" height="112" rx="8" fill="#fff0d1" stroke="#f08d78" stroke-width="2.5"/><use href="#icon-file" transform="translate(180 12) scale(.62)" color="#f08d78"/><text x="20" y="38" class="h">7. Manual promotion</text><text x="20" y="68" class="b">Approved checksum and</text><text x="20" y="88" class="b">surface configuration</text></g>
  <path d="M265 181H355" class="l"/><path d="M565 181H655" class="l"/><path d="M865 181H955" class="l"/><path d="M1070 237V300H920V355" class="l"/><path d="M805 411H735" class="l"/><path d="M505 411H435" class="l"/>
  <path d="M320 467V540H1070V237" class="l"/><text x="640" y="566" text-anchor="middle" class="s">New terminal outcomes enter the next reviewed batch only.</text>
  <rect x="205" y="598" width="830" height="52" rx="8" fill="#ffe4d8" stroke="#dd6b76"/><text x="620" y="630" text-anchor="middle" class="h">Rollback changes the active pointer; historical decisions and artifacts remain immutable.</text>
</svg>
