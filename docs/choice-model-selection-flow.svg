<svg viewBox="0 0 1180 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe choice model runtime selection flow</title>
  <desc id="desc">A runtime flow showing eligible candidates and minimized context entering ECloe Engine, active policy ranking, shadow challengers, and persisted decisions.</desc>
  <defs>
    <linearGradient id="ecloeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffde8"/>
      <stop offset="58%" stop-color="#f7ffb9"/>
      <stop offset="100%" stop-color="#dcfff0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087f83"/>
    </marker>
    <g id="icon-web" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="32" height="24" rx="3"/>
      <line x1="4" y1="13" x2="36" y2="13"/>
      <circle cx="10" cy="10" r="1"/>
      <circle cx="15" cy="10" r="1"/>
    </g>
    <g id="icon-gate" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 32V12h24v20"/>
      <path d="M14 32V18h12v14"/>
      <path d="M8 12l12-7 12 7"/>
    </g>
    <g id="icon-context" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="8" width="26" height="24" rx="4"/>
      <path d="M13 16h14M13 22h10M13 28h7"/>
    </g>
    <g id="icon-rank" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 29h20M10 20h14M10 11h8"/>
      <path d="M31 12v18M26 25l5 5 5-5"/>
    </g>
    <g id="icon-shadow" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="17" cy="17" r="9"/>
      <circle cx="24" cy="24" r="9"/>
    </g>
    <g id="icon-file" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5h13l7 7v23H11z"/>
      <path d="M24 5v8h7"/>
      <path d="M15 21h12M15 27h12"/>
    </g>
  </defs>
  <rect width="1180" height="420" fill="url(#ecloeBg)"/>
  <text x="40" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#14343b">Runtime Choice Selection Flow</text>
  <text x="40" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#087f83">The Engine ranks only candidates that Market or Pay already made eligible, then records the decision and shadow evidence.</text>

  <rect x="40" y="118" width="190" height="114" rx="10" fill="#e5fff7" stroke="#0bb9b0" stroke-width="2" data-card="true"/>
  <use href="#icon-gate" transform="translate(123 128) scale(.6)" color="#0bb9b0"/>
  <text x="135" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b" text-anchor="middle">Upstream eligibility</text>
  <text x="135" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83" text-anchor="middle">Market stock rules</text>
  <text x="135" y="213" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83" text-anchor="middle">Pay benefit rules</text>

  <line x1="230" y1="175" x2="278" y2="175" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="278" y="118" width="190" height="114" rx="10" fill="#fffbd9" stroke="#8bd9cf" stroke-width="2" data-card="true"/>
  <use href="#icon-context" transform="translate(361 128) scale(.6)" color="#087f83"/>
  <text x="373" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b" text-anchor="middle">Typed request</text>
  <text x="373" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83" text-anchor="middle">Minimized context</text>
  <text x="373" y="213" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83" text-anchor="middle">Eligible candidates</text>

  <line x1="468" y1="175" x2="516" y2="175" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="516" y="96" width="190" height="136" rx="10" fill="#e5fff7" stroke="#0bb9b0" stroke-width="2" data-card="true"/>
  <use href="#icon-rank" transform="translate(599 106) scale(.6)" color="#0bb9b0"/>
  <text x="611" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b" text-anchor="middle">Active policy</text>
  <text x="611" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83" text-anchor="middle">Baseline by default</text>
  <text x="611" y="193" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83" text-anchor="middle">Likelihood if gated</text>
  <text x="611" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83" text-anchor="middle">Stable tie-break</text>

  <polyline points="706,155 760,155 760,98 814,98" fill="none" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <polyline points="706,195 760,195 760,282 814,282" fill="none" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="814" y="56" width="210" height="114" rx="10" fill="#fffbd9" stroke="#8bd9cf" stroke-width="2" data-card="true"/>
  <use href="#icon-shadow" transform="translate(907 66) scale(.6)" color="#087f83"/>
  <text x="919" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b" text-anchor="middle">Shadow challengers</text>
  <text x="919" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83" text-anchor="middle">Epsilon, UCB1</text>
  <text x="919" y="151" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83" text-anchor="middle">Thompson Sampling</text>

  <rect x="814" y="240" width="210" height="114" rx="10" fill="#fffbd9" stroke="#8bd9cf" stroke-width="2" data-card="true"/>
  <use href="#icon-file" transform="translate(907 250) scale(.6)" color="#087f83"/>
  <text x="919" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b" text-anchor="middle">Decision output</text>
  <text x="919" y="317" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83" text-anchor="middle">Rank, score, reasons</text>
  <text x="919" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83" text-anchor="middle">Policy metadata</text>

  <polyline points="1024,113 1080,113 1080,297 1024,297" fill="none" stroke="#0bb9b0" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="1036" y="190" width="104" height="30" rx="8" fill="#d9fff0" stroke="#0bb9b0"/>
  <text x="1088" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#14343b" text-anchor="middle">audit evidence</text>

  <rect x="40" y="374" width="1100" height="28" rx="8" fill="#fffbd9" stroke="#8bd9cf"/>
  <text x="60" y="393" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#087f83">Guardrail: no runtime path creates eligibility, approves credit, changes prices, or uses blocked attributes.</text>
</svg>
