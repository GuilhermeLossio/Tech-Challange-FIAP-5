      <path d="M15 25h10M20 20v10"/>
    </g>
    <g id="icon-chart" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 31h24"/>
      <rect x="10" y="20" width="5" height="11" rx="1"/>
      <rect x="18" y="14" width="5" height="17" rx="1"/>
      <rect x="26" y="9" width="5" height="22" rx="1"/>
    </g>
