  <polyline points="580,389 675,389 675,389 965,389" fill="none" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="775" y="375" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#087f83">Market writes SQL</text>
  <line x1="580" y1="494" x2="745" y2="494" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="662" y="480" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#087f83">events to bus</text>
  <polyline points="580,482 650,482 650,560 1165,560 1165,284 1135,284" fill="none" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="858" y="546" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#087f83">Engine writes events</text>
  <polyline points="580,506 620,506 620,540 1190,540 1190,179 1135,179" fill="none" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="905" y="526" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#087f83">Engine reads artifact</text>
  <line x1="1050" y1="465" x2="1050" y2="418" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1080" y="446" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#087f83">secrets</text>

  <rect x="125" y="585" width="1100" height="50" rx="12" fill="#fffbd9" stroke="#8bd9cf"/>
  <text x="640" y="607" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14343b">Observability</text>
  <text x="640" y="626" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">All runtime services emit structured logs, metrics, traces, and dead-letter alerts to Application Insights with correlation IDs.</text>
  <line x1="160" y1="520" x2="160" y2="585" stroke="#087f83" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <line x1="485" y1="523" x2="485" y2="585" stroke="#087f83" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <line x1="1198" y1="520" x2="1198" y2="585" stroke="#087f83" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
</svg>
