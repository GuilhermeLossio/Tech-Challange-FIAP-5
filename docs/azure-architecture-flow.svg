  <use href="#icon-cart" transform="translate(973 370) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="1009" y="384" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14343b">Market SQL</text>
  <text x="1050" y="403" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#087f83">orders + outbox</text>
  <rect x="965" y="255" width="170" height="58" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-decision" transform="translate(973 265) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="1009" y="279" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14343b">Decision Store</text>
  <text x="1050" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#087f83">decisions/rewards</text>
  <rect x="965" y="150" width="170" height="58" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-bus" transform="translate(973 160) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="1009" y="174" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14343b">Blob Storage</text>
  <text x="1050" y="193" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#087f83">promoted artifacts</text>
  <rect x="745" y="465" width="170" height="58" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-shield" transform="translate(753 475) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="789" y="489" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14343b">Service Bus</text>
  <text x="830" y="508" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#087f83">domain events</text>
  <rect x="965" y="465" width="170" height="58" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-shield" transform="translate(973 475) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="1013" y="489" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#14343b">Key Vault</text>
  <text x="1050" y="508" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#087f83">managed secrets</text>

  <line x1="580" y1="284" x2="745" y2="284" stroke="#0bb9b0" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
