<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe low-consumption Azure target architecture</title>
  <desc id="desc">Low-consumption Azure architecture with orthogonal connectors. Demo Web reaches API Gateway/Auth and Demo BFF, Container Apps host the domain APIs, Pay and Market write their Azure SQL stores, Engine writes Cosmos decisions and rewards, Engine reads promoted Blob artifacts through a routed connector, all services use Key Vault, and all major sections emit telemetry to Observability.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">ECloe Low-Consumption Azure Architecture</text>
  <text x="640" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Small runtime, explicit domain stores, managed secrets, telemetry, and orthogonal data flows</text>

  <rect x="40" y="105" width="240" height="415" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="65" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Access</text>
  <rect x="75" y="165" width="170" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="199" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Demo Web</text>
  <rect x="75" y="305" width="170" height="76" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="160" y="333" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">API Gateway/Auth</text>
  <text x="160" y="353" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">JWT, rate limit,</text>
  <text x="160" y="371" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">correlation IDs</text>
  <line x1="160" y1="223" x2="160" y2="305" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="193" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">HTTPS</text>

  <rect x="340" y="105" width="290" height="415" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Container Apps or App Service</text>
  <rect x="390" y="150" width="190" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="485" y="184" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Demo BFF</text>
  <rect x="390" y="255" width="190" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="485" y="279" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Pay Transaction API</text>
  <text x="485" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">wallet and payments</text>
  <rect x="390" y="360" width="190" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="485" y="384" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Market Transaction API</text>
  <text x="485" y="403" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">catalog and orders</text>
  <rect x="390" y="465" width="190" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="485" y="489" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Engine Decision API</text>
  <text x="485" y="508" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">decision serving</text>

  <polyline points="160,381 160,548 330,548 330,179 390,179" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="250" y="535" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">secure route</text>
  <line x1="485" y1="208" x2="485" y2="255" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="512" y="237" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">wallet</text>
  <line x1="485" y1="313" x2="485" y2="360" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="512" y="342" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">checkout</text>
  <line x1="485" y1="418" x2="485" y2="465" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="512" y="447" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">decision</text>

  <rect x="700" y="105" width="500" height="415" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="725" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Managed state, integration, and controls</text>
  <rect x="745" y="255" width="170" height="58" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="830" y="279" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Pay SQL Store</text>
  <text x="830" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">state + outbox</text>
  <rect x="965" y="360" width="170" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1050" y="384" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Market SQL Store</text>
  <text x="1050" y="403" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">orders + outbox</text>
  <rect x="965" y="255" width="170" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1050" y="279" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Cosmos DB</text>
  <text x="1050" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">decisions/rewards</text>
  <rect x="965" y="150" width="170" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1050" y="174" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Blob Storage</text>
  <text x="1050" y="193" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">promoted artifacts</text>
  <rect x="745" y="465" width="170" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="830" y="489" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Service Bus</text>
  <text x="830" y="508" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">domain events</text>
  <rect x="965" y="465" width="170" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1050" y="489" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Key Vault</text>
  <text x="1050" y="508" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">managed secrets</text>

  <line x1="580" y1="284" x2="745" y2="284" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="662" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">Pay writes SQL</text>
  <polyline points="580,389 675,389 675,389 965,389" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="775" y="375" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">Market writes SQL</text>
  <line x1="580" y1="494" x2="745" y2="494" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="662" y="480" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">events to bus</text>
  <polyline points="580,482 650,482 650,560 1165,560 1165,284 1135,284" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="858" y="546" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">Engine writes events</text>
  <polyline points="580,506 620,506 620,540 1190,540 1190,179 1135,179" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="905" y="526" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">Engine reads artifact</text>
  <line x1="1050" y1="465" x2="1050" y2="418" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1080" y="446" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">secrets</text>

  <rect x="125" y="585" width="1100" height="50" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="640" y="607" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Observability</text>
  <text x="640" y="626" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">All runtime services emit structured logs, metrics, traces, and dead-letter alerts to Application Insights with correlation IDs.</text>
  <line x1="160" y1="520" x2="160" y2="585" stroke="#57606a" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <line x1="485" y1="523" x2="485" y2="585" stroke="#57606a" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <line x1="1198" y1="520" x2="1198" y2="585" stroke="#57606a" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
</svg>
