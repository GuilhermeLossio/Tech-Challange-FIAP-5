  <text x="434" y="279" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14343b">Pay Transaction API</text>
  <text x="485" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#087f83">wallet and payments</text>
