  <rect width="1280" height="720" fill="url(#ecloeBg)"/>
  <text x="640" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14343b">ECloe Low-Consumption Azure Architecture</text>
  <text x="640" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#087f83">Small runtime, explicit domain stores, managed secrets, telemetry, and orthogonal data flows</text>

