  <text x="65" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#087f83">Access</text>
  <rect x="75" y="165" width="170" height="58" rx="10" fill="#d9fff0" stroke="#0bb9b0" stroke-width="1.5" data-card="true"/>
  <use href="#icon-web" transform="translate(83 175) scale(0.30)" color="#0bb9b0" aria-hidden="true"/>
  <text x="123" y="199" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Web</text>
  <rect x="75" y="305" width="170" height="76" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
  <use href="#icon-shield" transform="translate(83 315) scale(0.30)" color="#087f83" aria-hidden="true"/>
  <text x="123" y="333" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14343b">Gateway</text>
  <text x="160" y="353" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">JWT, rate limit,</text>
  <text x="160" y="371" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#087f83">correlation IDs</text>
