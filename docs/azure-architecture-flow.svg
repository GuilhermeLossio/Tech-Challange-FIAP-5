  <line x1="485" y1="313" x2="485" y2="360" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="512" y="342" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#087f83">checkout</text>
  <line x1="485" y1="418" x2="485" y2="465" stroke="#087f83" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="512" y="447" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#087f83">decision</text>

