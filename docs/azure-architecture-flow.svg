  <text x="434" y="384" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14343b">Market Transaction API</text>
  <text x="485" y="403" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#087f83">catalog and orders</text>
  <rect x="390" y="465" width="190" height="58" rx="10" fill="#fffbd9" stroke="#8bd9cf" data-card="true"/>
