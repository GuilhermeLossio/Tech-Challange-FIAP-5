  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">ECloe Pay Real-Ready Overview</text>
  <text x="640" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Runtime boundaries, transactional outbox, domain stores, security, and observability</text>

  <rect x="40" y="105" width="250" height="455" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="65" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Experience and perimeter</text>
  <rect x="75" y="170" width="180" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" data-card="true"/>
  <use href="#icon-web" transform="translate(83 180) scale(0.30)" color="#2563eb" aria-hidden="true"/>
  <text x="123" y="202" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Web</text>
  <text x="165" y="221" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Market and Pay UI</text>
  <rect x="75" y="285" width="180" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-shield" transform="translate(83 295) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="123" y="312" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">API Gateway</text>
  <text x="165" y="331" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Auth, JWT, rate</text>
  <text x="165" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">limit, correlation</text>
  <rect x="75" y="410" width="180" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-api" transform="translate(83 420) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="123" y="438" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Demo BFF</text>
  <text x="165" y="457" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Demo session and</text>
  <text x="165" y="474" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">journey orchestration</text>
  <line x1="165" y1="232" x2="165" y2="285" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="205" y="263" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">HTTPS</text>
  <line x1="165" y1="357" x2="165" y2="410" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="195" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">route</text>

  <rect x="355" y="105" width="295" height="455" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Domain APIs</text>
  <rect x="405" y="195" width="195" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" data-card="true"/>
  <use href="#icon-api" transform="translate(413 205) scale(0.30)" color="#2563eb" aria-hidden="true"/>
  <text x="453" y="224" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Pay API</text>
  <text x="502" y="244" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Wallet, ledger,</text>
  <text x="502" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">payment state</text>
  <rect x="405" y="385" width="195" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-api" transform="translate(413 395) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="453" y="414" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Engine API</text>
  <text x="502" y="434" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Eligible-offer ranking</text>
  <text x="502" y="452" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">and reward ingest</text>
  <polyline points="255,445 330,445 330,234 405,234" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="334" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">wallet actions</text>
  <line x1="502" y1="273" x2="502" y2="385" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="535" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">decision and reward calls</text>

  <rect x="720" y="105" width="500" height="455" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="745" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Stores and async integration</text>
  <rect x="770" y="170" width="190" height="82" rx="10" fill="#eff6ff" stroke="#2563eb" data-card="true"/>
  <use href="#icon-wallet" transform="translate(778 180) scale(0.30)" color="#2563eb" aria-hidden="true"/>
  <text x="818" y="202" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Pay Store</text>
  <text x="865" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Azure SQL</text>
  <text x="865" y="240" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">state + outbox row</text>
  <rect x="1010" y="170" width="160" height="82" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-database" transform="translate(1018 180) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="1058" y="202" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Publisher</text>
  <text x="1090" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">polls SQL outbox</text>
  <rect x="1010" y="320" width="160" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-decision" transform="translate(1018 330) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="1058" y="352" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Bus</text>
  <text x="1090" y="372" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">domain events</text>
  <rect x="770" y="320" width="190" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-decision" transform="translate(778 330) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="818" y="352" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Store</text>
  <text x="865" y="372" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Cosmos DB</text>
  <rect x="770" y="455" width="190" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-worker" transform="translate(778 465) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="818" y="487" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Export</text>
  <text x="865" y="507" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">writes reports</text>
  <rect x="1010" y="455" width="160" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-artifact" transform="translate(1018 465) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="1058" y="487" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Blob</text>
  <text x="1090" y="507" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">artifacts only</text>

  <polyline points="600,234 685,234 685,211 770,211" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="685" y="205" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">persist transaction</text>
  <line x1="960" y1="211" x2="1010" y2="211" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="985" y="197" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">poll</text>
  <line x1="1090" y1="252" x2="1090" y2="320" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1118" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">publish</text>
  <polyline points="600,424 685,424 685,355 770,355" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="665" y="377" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">write decision/reward</text>
  <line x1="960" y1="490" x2="1010" y2="490" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="985" y="476" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">upload</text>

  <rect x="70" y="610" width="520" height="58" rx="12" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-shield" transform="translate(81 620) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="330" y="635" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Security</text>
  <text x="330" y="654" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Gateway, Entra/JWT, CSRF for browser routes, rate limits, Key Vault secrets</text>
  <rect x="690" y="610" width="520" height="58" rx="12" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-eye" transform="translate(701 620) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="950" y="635" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Observability</text>
  <text x="950" y="654" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Structured logs, metrics, traces, correlation IDs, Application Insights</text>
</svg>
