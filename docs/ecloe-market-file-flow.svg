  <text x="164" y="358" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">Contract and flow tests</text>

  <rect x="350" y="100" width="250" height="300" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="375" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Transactional records</text>
  <rect x="382" y="150" width="185" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
