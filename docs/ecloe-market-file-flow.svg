<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe Market file and data flow</title>
  <desc id="desc">File and data flow for ECloe Market showing source files and migrations defining Market behavior, Azure SQL storing transactional state and outbox rows, Outbox Publisher polling outbox rows, Service Bus distributing events, projection workers writing Cosmos read models, and export services writing Blob artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">ECloe Market File and Data Flow</text>
  <text x="600" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Source and migrations define behavior; stores and integrations keep domain ownership explicit</text>

  <rect x="45" y="115" width="230" height="310" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Repository inputs</text>
  <rect x="80" y="180" width="160" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="204" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Market source</text>
  <text x="160" y="223" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">future src/market</text>
  <rect x="80" y="290" width="160" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="160" y="314" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">SQL migrations</text>
  <text x="160" y="333" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">schemas + indexes</text>

  <rect x="350" y="115" width="230" height="310" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="375" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Transactional state</text>
  <rect x="385" y="185" width="160" height="70" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="465" y="212" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Azure SQL</text>
  <text x="465" y="232" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">catalog, cart,</text>
  <text x="465" y="249" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">orders, inventory</text>
  <rect x="385" y="305" width="160" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="465" y="329" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Outbox rows</text>
  <text x="465" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">same transaction</text>

  <rect x="655" y="115" width="230" height="310" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="680" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Async publication</text>
  <rect x="690" y="185" width="160" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="770" y="211" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Outbox Publisher</text>
  <text x="770" y="231" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">polls rows</text>
  <rect x="690" y="305" width="160" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="770" y="329" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Service Bus</text>
  <text x="770" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">domain events</text>

  <rect x="960" y="115" width="210" height="310" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="985" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Derived outputs</text>
  <rect x="995" y="180" width="140" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1065" y="204" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Projection Worker</text>
  <text x="1065" y="223" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">consumes events</text>
  <rect x="995" y="270" width="140" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1065" y="294" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Cosmos DB</text>
  <text x="1065" y="313" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">read models</text>
  <rect x="995" y="360" width="140" height="42" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1065" y="386" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Blob exports</text>

  <polyline points="240,209 310,209 310,220 385,220" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="313" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">runtime writes</text>
  <polyline points="240,319 310,319 310,334 385,334" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="313" y="314" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">apply migrations</text>
  <polyline points="545,334 618,334 618,217 690,217" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="621" y="260" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">poll/read</text>
  <line x1="770" y1="249" x2="770" y2="305" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="798" y="281" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">publish</text>
  <polyline points="850,334 922,334 922,209 995,209" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="928" y="254" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">consume</text>
  <line x1="1065" y1="238" x2="1065" y2="270" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1090" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">write</text>
  <line x1="1065" y1="328" x2="1065" y2="360" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1090" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">export</text>

  <rect x="95" y="475" width="1010" height="42" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="600" y="501" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Service Bus does not write Blob Storage; consumers or export services perform projection and artifact writes explicitly.</text>
</svg>
