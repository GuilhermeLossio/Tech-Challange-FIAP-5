  <text x="164" y="181" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">src/market/</text>
  <text x="164" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">API and domain code</text>
  <rect x="72" y="240" width="185" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="164" y="261" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">migrations/</text>
  <text x="164" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">PostgreSQL schema</text>
