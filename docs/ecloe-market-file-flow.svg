  <rect x="695" y="260" width="150" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="770" y="281" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Service Bus</text>
  <text x="770" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">Domain events</text>

  <rect x="940" y="100" width="200" height="300" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="965" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Read and artifact outputs</text>
  <rect x="970" y="150" width="140" height="48" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1040" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Cosmos DB</text>
  <text x="1040" y="187" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">Projections</text>
  <rect x="970" y="232" width="140" height="48" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1040" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Blob Storage</text>
  <text x="1040" y="269" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">Exports</text>
  <rect x="970" y="314" width="140" height="48" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1040" y="334" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Reports</text>
  <text x="1040" y="351" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">Control Room</text>

  <line x1="257" y1="186" x2="382" y2="179" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <line x1="257" y1="266" x2="382" y2="179" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="474" y1="208" x2="474" y2="238" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="567" y1="267" x2="695" y2="186" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="770" y1="212" x2="770" y2="260" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="845" y1="286" x2="970" y2="174" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="845" y1="286" x2="970" y2="256" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="845" y1="286" x2="970" y2="338" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="95" y="435" width="990" height="42" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="590" y="461" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Planned file flow: source and migrations define Market behavior, PostgreSQL commits business state, outbox events feed projections and offline evidence.</text>
</svg>
