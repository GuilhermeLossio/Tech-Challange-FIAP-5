<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECloe Market file and data flow</title>
  <desc id="desc">File and data flow for ECloe Market showing source files and migrations defining Market behavior, Azure SQL storing transactional state and outbox rows, Outbox Publisher polling outbox rows, Service Bus distributing events, projection workers writing Cosmos read models, and export services writing Blob artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>

    <g id="icon-web" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="9" width="26" height="19" rx="3"/>
      <path d="M7 15h26M15 33h10M20 28v5"/>
    </g>
    <g id="icon-shield" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 5l12 5v9c0 8-5 13-12 16C13 32 8 27 8 19v-9l12-5z"/>
      <path d="M15 20l4 4 7-8"/>
    </g>
    <g id="icon-api" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 12l-7 8 7 8M27 12l7 8-7 8M23 9l-6 22"/>
    </g>
    <g id="icon-wallet" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 13h24a4 4 0 0 1 4 4v13H9a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4h20v5"/>
      <path d="M27 22h8M29 22h1"/>
    </g>
    <g id="icon-cart" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8h4l4 17h16l4-12H13"/>
      <circle cx="17" cy="32" r="2.4"/>
      <circle cx="29" cy="32" r="2.4"/>
    </g>
    <g id="icon-decision" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 13h8M8 27h8M24 20h8"/>
      <circle cx="20" cy="13" r="4"/>
      <circle cx="20" cy="27" r="4"/>
      <circle cx="20" cy="20" r="4"/>
    </g>
    <g id="icon-database" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="20" cy="10" rx="12" ry="5"/>
      <path d="M8 10v18c0 3 5 5 12 5s12-2 12-5V10"/>
      <path d="M8 19c0 3 5 5 12 5s12-2 12-5"/>
    </g>
    <g id="icon-bus" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="10" width="26" height="20" rx="4"/>
      <path d="M11 16h18M11 22h12"/>
      <path d="M14 34v-4M26 34v-4"/>
    </g>
    <g id="icon-worker" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="5"/>
      <path d="M20 6v5M20 29v5M6 20h5M29 20h5M10 10l4 4M26 26l4 4M30 10l-4 4M14 26l-4 4"/>
    </g>
    <g id="icon-artifact" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 12h10l3 4h13v15H7z"/>
      <path d="M15 25h10M20 20v10"/>
    </g>
    <g id="icon-chart" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 31h24"/>
      <rect x="10" y="20" width="5" height="11" rx="1"/>
      <rect x="18" y="14" width="5" height="17" rx="1"/>
      <rect x="26" y="9" width="5" height="22" rx="1"/>
    </g>
    <g id="icon-doc" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6h12l6 6v22H12z"/>
      <path d="M24 6v8h6M16 20h12M16 26h12"/>
    </g>
    <g id="icon-eye" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 20s6-9 15-9 15 9 15 9-6 9-15 9-15-9-15-9z"/>
      <circle cx="20" cy="20" r="4"/>
    </g>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">ECloe Market File and Data Flow</text>
  <text x="600" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Source and migrations define behavior; stores and integrations keep domain ownership explicit</text>

  <rect x="45" y="115" width="230" height="310" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Repository inputs</text>
  <rect x="80" y="180" width="160" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" data-card="true"/>
  <use href="#icon-cart" transform="translate(88 190) scale(0.30)" color="#2563eb" aria-hidden="true"/>
  <text x="124" y="204" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Market Source</text>
  <text x="160" y="223" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">future src/market</text>
  <rect x="80" y="290" width="160" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-database" transform="translate(88 300) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="128" y="314" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Migrations</text>
  <text x="160" y="333" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">schemas + indexes</text>

  <rect x="350" y="115" width="230" height="310" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="375" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Transactional state</text>
  <rect x="385" y="185" width="160" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" data-card="true"/>
  <use href="#icon-cart" transform="translate(393 195) scale(0.30)" color="#2563eb" aria-hidden="true"/>
  <text x="429" y="212" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Market SQL</text>
  <text x="465" y="232" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">catalog, cart,</text>
  <text x="465" y="249" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">orders, inventory</text>
  <rect x="385" y="305" width="160" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-bus" transform="translate(393 315) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="429" y="329" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">SQL Outbox</text>
  <text x="465" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">same transaction</text>

  <rect x="655" y="115" width="230" height="310" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="680" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Async publication</text>
  <rect x="690" y="185" width="160" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-bus" transform="translate(698 195) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="734" y="217" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2328">Outbox Publisher</text>
  <text x="770" y="237" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">polls rows</text>
  <rect x="690" y="305" width="160" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-bus" transform="translate(698 315) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="734" y="329" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Service Bus</text>
  <text x="770" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">domain events</text>

  <rect x="960" y="115" width="210" height="310" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="985" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a">Derived outputs</text>
  <rect x="995" y="180" width="140" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-decision" transform="translate(1003 190) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="1043" y="204" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328">Projection</text>
  <text x="1065" y="223" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">consumes events</text>
  <rect x="995" y="270" width="140" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-decision" transform="translate(1003 280) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="1039" y="294" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2328">Cosmos DB</text>
  <text x="1065" y="313" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.2" fill="#57606a">read models</text>
  <rect x="995" y="360" width="140" height="42" rx="10" fill="#f6f8fa" stroke="#d0d7de" data-card="true"/>
  <use href="#icon-worker" transform="translate(1003 370) scale(0.30)" color="#57606a" aria-hidden="true"/>
  <text x="1039" y="388" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2328">Export Service</text>

  <polyline points="240,209 310,209 310,220 385,220" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="313" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">runtime writes</text>
  <polyline points="240,319 310,319 310,334 385,334" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="313" y="314" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">apply migrations</text>
  <polyline points="545,334 618,334 618,217 690,217" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="621" y="260" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">poll/read</text>
  <line x1="770" y1="249" x2="770" y2="305" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="798" y="281" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">publish</text>
  <polyline points="850,334 922,334 922,209 995,209" fill="none" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="928" y="254" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">consume</text>
  <line x1="1065" y1="238" x2="1065" y2="270" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1090" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">write</text>
  <line x1="1065" y1="328" x2="1065" y2="360" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1090" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">export</text>

  <rect x="95" y="475" width="1010" height="42" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="600" y="501" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Service Bus does not write Blob Storage; consumers or export services perform projection and artifact writes explicitly.</text>
</svg>
